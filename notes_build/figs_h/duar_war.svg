<svg viewBox="0 0 470 122" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="0.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="18" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">1. Causes</text><text x="70.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">border raids/disputes in the</text><text x="70.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Duars; British want the</text><text x="70.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">fertile Duars (tea, revenue)</text><line x1="140.0" y1="28.0" x2="164.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="18" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">2. Eden mission 1864</text><text x="235.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">sent to Punakha; insulted;</text><text x="235.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">forced to sign a treaty</text><text x="235.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">giving up the Duars</text><line x1="305.0" y1="28.0" x2="329.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="18" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">3. War declared</text><text x="400.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Britain annexes Ambari</text><text x="400.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Falakata; declares war</text><text x="400.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">12 Nov 1864</text><path d="M400.0,50 L400.0,61.0 L70.0,61.0 L70.0,71" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="0.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="84" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">4. Fighting</text><text x="70.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Dewangiri retaken by</text><text x="70.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Bhutan (Jigme Namgyel)</text><text x="70.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">but British prevail</text><line x1="140.0" y1="94.0" x2="164.0" y2="94.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="84" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">5. Sinchula 11 Nov 1865</text><text x="235.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Duars + Dewangiri ceded;</text><text x="235.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">annual payment;</text><text x="235.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">peace and friendship</text><line x1="305.0" y1="94.0" x2="329.0" y2="94.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="84" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">6. Result</text><text x="400.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Bhutan loses ~1/5 land;</text><text x="400.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">closer ties with British;</text><text x="400.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">road to 1907 monarchy</text></svg>