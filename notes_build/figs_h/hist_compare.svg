<svg viewBox="0 0 470 172" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="10" y="6" width="215" height="24" rx="3" fill="#fbeed6" stroke="#b36200" stroke-width="1.5"/><text x="117.5" y="21.0" font-size="9" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">MEDIEVAL historiography</text><rect x="245" y="6" width="215" height="24" rx="3" fill="#dff1ee" stroke="#0f7b6c" stroke-width="1.5"/><text x="352.5" y="21.0" font-size="9" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">MODERN historiography</text><rect x="10" y="38" width="215" height="22" rx="3" fill="#fff" stroke="#b36200" stroke-width="1"/><text x="117" y="52" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Based on religion, will of God, myths</text><rect x="245" y="38" width="215" height="22" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1"/><text x="352" y="52" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Based on reason and evidence</text><text x="235" y="53" font-size="7" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">vs</text><rect x="10" y="64" width="215" height="22" rx="3" fill="#fff" stroke="#b36200" stroke-width="1"/><text x="117" y="78" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Focus: kings, wars, saints, glory of rulers</text><rect x="245" y="64" width="215" height="22" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1"/><text x="352" y="78" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Focus: all people, society, economy, women, environment</text><text x="235" y="79" font-size="7" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">vs</text><rect x="10" y="90" width="215" height="22" rx="3" fill="#fff" stroke="#b36200" stroke-width="1"/><text x="117" y="104" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Written by monks / court scribes (patrons)</text><rect x="245" y="90" width="215" height="22" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1"/><text x="352" y="104" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Written by trained historians (objective)</text><text x="235" y="105" font-size="7" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">vs</text><rect x="10" y="116" width="215" height="22" rx="3" fill="#fff" stroke="#b36200" stroke-width="1"/><text x="117" y="130" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Sources taken on trust, no checking</text><rect x="245" y="116" width="215" height="22" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1"/><text x="352" y="130" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Sources cross-checked; archaeology, oral history</text><text x="235" y="131" font-size="7" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">vs</text><rect x="10" y="142" width="215" height="22" rx="3" fill="#fff" stroke="#b36200" stroke-width="1"/><text x="117" y="156" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Single (religious / royal) viewpoint</text><rect x="245" y="142" width="215" height="22" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1"/><text x="352" y="156" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Many viewpoints; inclusive voices</text><text x="235" y="157" font-size="7" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">vs</text></svg>