<svg viewBox="0 0 470 56" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="0.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="18" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Vedic society</text><text x="70.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">costly yajnas, animal</text><text x="70.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">sacrifice, Brahmin power,</text><text x="70.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">rigid caste</text><line x1="140.0" y1="28.0" x2="164.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="18" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">6th c. BCE change</text><text x="235.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">new towns and traders;</text><text x="235.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">people question ritual</text><text x="235.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">and inequality</text><line x1="305.0" y1="28.0" x2="329.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="18" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">New paths</text><text x="400.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Buddhism (Buddha),</text><text x="400.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Jainism (Mahavira):</text><text x="400.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">non-violence, equality</text></svg>