<svg viewBox="0 0 470 136" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="165" y="6" width="140" height="30" rx="3" fill="#fbe9e8" stroke="#b3211b" stroke-width="1.5"/><text x="235.0" y="17.5" font-size="8.6" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">DRUK GYALPO</text><text x="235.0" y="28.5" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Head of State, symbol of unity</text><line x1="235" y1="36" x2="65" y2="58" stroke="#777" stroke-width="1.3" marker-end="url(#a)"/><rect x="10" y="58" width="110" height="52" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.5"/><text x="65.0" y="69.5" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">LEGISLATURE</text><text x="65.0" y="80.5" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Parliament:</text><text x="65.0" y="89.284" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">National Council +</text><text x="65.0" y="98.068" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">National Assembly</text><line x1="235" y1="36" x2="235" y2="58" stroke="#777" stroke-width="1.3" marker-end="url(#a)"/><rect x="180" y="58" width="110" height="52" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.5"/><text x="235.0" y="69.5" font-size="8.4" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">EXECUTIVE</text><text x="235.0" y="80.5" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Lhengye Zhungtshog</text><text x="235.0" y="89.284" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(Cabinet) led by the</text><text x="235.0" y="98.068" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Prime Minister</text><line x1="235" y1="36" x2="405" y2="58" stroke="#777" stroke-width="1.3" marker-end="url(#a)"/><rect x="350" y="58" width="110" height="52" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.5"/><text x="405.0" y="69.5" font-size="8.4" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">JUDICIARY</text><text x="405.0" y="80.5" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Supreme Court,</text><text x="405.0" y="89.284" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">High Court, Dzongkhag</text><text x="405.0" y="98.068" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">&amp; Dungkhag courts</text><text x="235" y="128" font-size="6.8" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal">Separation of powers (Constitution, 2008). Local: Dzongkhag Tshogdu (DT), Gewog Tshogde (GT), Thromde.</text></svg>