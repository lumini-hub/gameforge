<svg viewBox="0 0 470 196" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="165" y="6" width="140" height="30" rx="3" fill="#fbe9e8" stroke="#b3211b" stroke-width="1.5"/><text x="235.0" y="19.0" font-size="8" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">ZHABDRUNG NGAWANG</text><text x="235.0" y="28.759999999999998" font-size="8" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">NAMGYAL (supreme)</text><line x1="210" y1="36" x2="105" y2="62" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="260" y1="36" x2="365" y2="62" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="62" width="170" height="42" rx="3" fill="#e4ecf7" stroke="#0e3a66" stroke-width="1.5"/><text x="105.0" y="73.5" font-size="8.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">CHOE (religion)</text><text x="105.0" y="84.5" font-size="7.4" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">JE KHENPO - Chief Abbot</text><text x="105.0" y="93.528" font-size="7.4" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">heads the Central Monastic Body</text><rect x="280" y="62" width="170" height="42" rx="3" fill="#dff1ee" stroke="#0f7b6c" stroke-width="1.5"/><text x="365.0" y="73.5" font-size="8.6" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">SID (state)</text><text x="365.0" y="84.5" font-size="7.4" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">DRUK DESI - civil ruler</text><text x="365.0" y="93.528" font-size="7.4" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(3-year term, Council-elected)</text><line x1="365" y1="104" x2="365" y2="124" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="124" width="260" height="36" rx="3" fill="#fbeed6" stroke="#b36200" stroke-width="1.5"/><text x="320.0" y="135.5" font-size="8.4" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">CHOGI CHILA NAMSUM (3 Poenlops)</text><text x="320.0" y="146.5" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Paro (west)  |  Dagana (south)  |  Trongsa (east)</text><line x1="320" y1="160" x2="320" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="172" width="260" height="18" rx="3" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="320.0" y="184.0" font-size="7.6" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">Dzongpoens (dzong governors)</text><rect x="20" y="124" width="150" height="36" rx="3" fill="#efe7f6" stroke="#5b3a8a" stroke-width="1.5"/><text x="95.0" y="135.5" font-size="8" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">Dzong = both monastery</text><text x="95.0" y="146.5" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">and administrative centre</text></svg>