<svg viewBox="0 0 470 220" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Mobile banking program: logic</text><rect x="160" y="24" width="150" height="20" rx="4" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.4"/><text x="235.0" y="37.0" font-size="8.35" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">balance = 1000</text><line x1="235" y1="44" x2="235" y2="54" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M235,54 L300,72 L235,90 L170,72 Z" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.4"/><text x="235" y="75" font-size="8.12" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">while True: menu</text><line x1="235" y1="90" x2="235" y2="102" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M235,102 L300,120 L235,138 L170,120 Z" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.4"/><text x="235" y="123" font-size="8.58" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">choice ?</text><line x1="235" y1="138" x2="65" y2="158" stroke="#555" stroke-width="1.2"/><rect x="30" y="158" width="70" height="36" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="65" y="172" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">1: print balance</text><line x1="235" y1="138" x2="157" y2="158" stroke="#555" stroke-width="1.2"/><rect x="122" y="158" width="70" height="36" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="157" y="172" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">2: deposit</text><text x="157" y="181" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(amount &gt; 0)</text><line x1="235" y1="138" x2="249" y2="158" stroke="#555" stroke-width="1.2"/><rect x="214" y="158" width="70" height="36" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="249" y="172" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">3: withdraw</text><text x="249" y="181" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(0 &lt; amt &lt;= bal.)</text><line x1="235" y1="138" x2="341" y2="158" stroke="#555" stroke-width="1.2"/><rect x="306" y="158" width="70" height="36" rx="4" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.4"/><text x="341" y="172" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">4: print thanks</text><text x="341" y="181" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">break</text><line x1="235" y1="138" x2="433" y2="158" stroke="#555" stroke-width="1.2"/><rect x="398" y="158" width="70" height="36" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="433" y="172" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">other:</text><text x="433" y="181" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">invalid selection</text><path d="M42,194 L42,214 L430,214 L430,72 L300,72" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/><text x="235" y="210" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">back to the menu (loop) until the user chooses 4</text></svg>