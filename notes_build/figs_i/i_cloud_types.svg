<svg viewBox="0 0 470 168" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Types of cloud (deployment models)</text><rect x="6" y="24" width="110" height="112" rx="6" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.6"/><text x="61" y="42" font-size="9.0" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">PRIVATE</text><text x="61" y="62.0" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">one organisation only;</text><text x="61" y="71.5" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">most control and security</text><text x="61" y="100" font-size="7.66" text-anchor="middle" fill="#555" font-weight="bold" font-style="normal">Example:</text><text x="61" y="111" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">school or bank</text><text x="61" y="120" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">data</text><rect x="122" y="24" width="110" height="112" rx="6" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="177" y="42" font-size="9.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">PUBLIC</text><text x="177" y="62.0" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">shared; provider owns it;</text><text x="177" y="71.5" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">cheap, pay as you go</text><text x="177" y="100" font-size="7.66" text-anchor="middle" fill="#555" font-weight="bold" font-style="normal">Example:</text><text x="177" y="111" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">Google Drive,</text><text x="177" y="120" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">Dropbox</text><rect x="238" y="24" width="110" height="112" rx="6" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="293" y="42" font-size="9.0" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">HYBRID</text><text x="293" y="62.0" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">private + public mixed;</text><text x="293" y="71.5" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">sensitive data kept private</text><text x="293" y="100" font-size="7.66" text-anchor="middle" fill="#555" font-weight="bold" font-style="normal">Example:</text><text x="293" y="111" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">secure records +</text><text x="293" y="120" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">public website</text><rect x="354" y="24" width="110" height="112" rx="6" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/><text x="409" y="42" font-size="9.0" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">COMMUNITY</text><text x="409" y="62.0" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">shared by several groups</text><text x="409" y="71.5" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">with the same needs</text><text x="409" y="100" font-size="7.66" text-anchor="middle" fill="#555" font-weight="bold" font-style="normal">Example:</text><text x="409" y="111" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">several colleges /</text><text x="409" y="120" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">hospitals</text><text x="235" y="152.0" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">A school that wants high control and security of its own data should choose a</text><text x="235" y="160.296" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">PRIVATE cloud (P25 Q1a(vi)).</text></svg>