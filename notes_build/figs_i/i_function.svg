<svg viewBox="0 0 470 184" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Anatomy of a function</text><rect x="10" y="24" width="216" height="120" rx="3" fill="#f7f7f7" stroke="#888" stroke-width="1"/><text x="20" y="42" font-size="9.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">def add(a, b=10):</text><text x="20" y="60" font-size="9.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    total = a + b</text><text x="20" y="78" font-size="9.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    return total</text><text x="20" y="114" font-size="9.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">result = add(5)</text><text x="20" y="132" font-size="9.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">print(result)</text><line x1="240" y1="36" x2="150" y2="38" stroke="#1f5fa8" stroke-width="0.9"/><text x="244" y="38.0" font-size="8.12" text-anchor="start" fill="#1f5fa8" font-weight="bold" font-style="normal">def = keyword</text><text x="244" y="47.5" font-size="8.12" text-anchor="start" fill="#1f5fa8" font-weight="bold" font-style="normal">add = function name</text><line x1="240" y1="64" x2="120" y2="42" stroke="#2a7a3a" stroke-width="0.9"/><text x="244" y="66.0" font-size="8.12" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">a, b = parameters</text><text x="244" y="75.5" font-size="8.12" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">(b = 10 is a default value)</text><line x1="240" y1="92" x2="120" y2="76" stroke="#a05a00" stroke-width="0.9"/><text x="244" y="94.0" font-size="8.12" text-anchor="start" fill="#a05a00" font-weight="bold" font-style="normal">return sends back the</text><text x="244" y="103.5" font-size="8.12" text-anchor="start" fill="#a05a00" font-weight="bold" font-style="normal">return value</text><line x1="240" y1="120" x2="120" y2="112" stroke="#7a3b9b" stroke-width="0.9"/><text x="244" y="122.0" font-size="8.12" text-anchor="start" fill="#7a3b9b" font-weight="bold" font-style="normal">add(5) = function CALL;</text><text x="244" y="131.5" font-size="8.12" text-anchor="start" fill="#7a3b9b" font-weight="bold" font-style="normal">5 = argument (b becomes 10)</text><text x="244" y="148" font-size="8.35" text-anchor="start" fill="#b3211b" font-weight="bold" font-style="normal">result = 15</text><text x="235" y="168" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Local variables (total) exist only inside the function.</text><text x="235" y="178" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">If a function is defined twice with the same name, only the LAST definition is kept.</text></svg>