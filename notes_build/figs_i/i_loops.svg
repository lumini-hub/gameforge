<svg viewBox="0 0 470 194" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">How loops work</text><rect x="6" y="18" width="228" height="168" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="120.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">while loop (condition first)</text><rect x="60" y="38" width="120" height="22" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="120" y="53" font-size="8.82" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">i = 0   (start)</text><line x1="120" y1="60" x2="120" y2="72" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M120,72 L176,92 L120,112 L64,92 Z" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.4"/><text x="120" y="95" font-size="8.82" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">i &lt; 5 ?</text><line x1="120" y1="112" x2="120" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="128" y="122" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">True</text><rect x="60" y="128" width="120" height="22" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="120" y="143" font-size="8.35" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">print(i);  i += 1</text><line x1="180" y1="139" x2="208" y2="139" stroke="#333" stroke-width="1.4"/><line x1="208" y1="139" x2="208" y2="92" stroke="#333" stroke-width="1.4"/><line x1="208" y1="92" x2="176" y2="92" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="64" y1="92" x2="24" y2="92" stroke="#333" stroke-width="1.4"/><text x="34" y="88" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">False</text><line x1="24" y1="92" x2="24" y2="170" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="24" y="180" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">exit loop</text><rect x="238" y="18" width="226" height="168" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="351.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">for loop with range()</text><rect x="262" y="38" width="178" height="22" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="351" y="53" font-size="8.82" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">for i in range(1, 4):</text><line x1="351" y1="60" x2="351" y2="76" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="262" y="76" width="178" height="22" rx="0" fill="#fff4e0" stroke="#a05a00" stroke-width="1.4"/><text x="351" y="91" font-size="8.58" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">i takes 1, then 2, then 3</text><line x1="351" y1="98" x2="351" y2="114" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="262" y="114" width="178" height="22" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="351" y="129" font-size="8.58" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">run the loop body</text><line x1="351" y1="136" x2="351" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="351" y="164" font-size="8.12" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">repeat until the sequence ends</text></svg>