<svg viewBox="0 0 470 180" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Indexing and slicing a list</text><rect x="80" y="46" width="60" height="34" rx="0" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="110" y="68" font-size="11.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">10</text><text x="110" y="38" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">0</text><text x="110" y="96" font-size="8.6" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">-5</text><rect x="146" y="46" width="60" height="34" rx="0" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="176" y="68" font-size="11.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">20</text><text x="176" y="38" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">1</text><text x="176" y="96" font-size="8.6" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">-4</text><rect x="212" y="46" width="60" height="34" rx="0" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="242" y="68" font-size="11.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">30</text><text x="242" y="38" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">2</text><text x="242" y="96" font-size="8.6" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">-3</text><rect x="278" y="46" width="60" height="34" rx="0" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="308" y="68" font-size="11.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">40</text><text x="308" y="38" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">3</text><text x="308" y="96" font-size="8.6" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">-2</text><rect x="344" y="46" width="60" height="34" rx="0" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="374" y="68" font-size="11.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">50</text><text x="374" y="38" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">4</text><text x="374" y="96" font-size="8.6" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">-1</text><text x="70" y="38" font-size="8.82" text-anchor="end" fill="#2a7a3a" font-weight="bold" font-style="normal">index</text><text x="70" y="96" font-size="8.82" text-anchor="end" fill="#a05a00" font-weight="bold" font-style="normal">negative</text><text x="32" y="68" font-size="8.0" text-anchor="end" fill="#111" font-weight="bold" font-style="normal">data =</text><path d="M146,106 L146,114 L344,114 L344,106" fill="none" stroke="#b3211b" stroke-width="1.8"/><text x="245" y="126" font-size="8.58" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">data[1:4]  →  [20, 30, 40]   (start 1 included, stop 4 NOT included)</text><text x="235" y="146" font-size="7.66" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">data[0:3] → [10,20,30]      data[1:3] → [20,30]      data[2:5] → [30,40,50]      data[-1] → 50      data[:2] → [10,20]</text><text x="235" y="160" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">colors = ["red","green","blue"]  →  colors[-1] is "blue" (last item)  (P25 Q4c)</text></svg>