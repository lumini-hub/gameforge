<svg viewBox="0 0 470 192" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">countConsonants("Bhutan") unfolds step by step</text><rect x="10" y="26" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="38" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"Bhutan"</text><text x="82" y="38" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">B is a consonant</text><text x="212" y="38" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">1 + count("hutan")</text><rect x="10" y="48" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="60" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"hutan"</text><text x="82" y="60" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">h is a consonant</text><text x="212" y="60" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">1 + count("utan")</text><rect x="10" y="70" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="82" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"utan"</text><text x="82" y="82" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">u is a vowel</text><text x="212" y="82" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">count("tan")</text><rect x="10" y="92" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="104" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"tan"</text><text x="82" y="104" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">t is a consonant</text><text x="212" y="104" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">1 + count("an")</text><rect x="10" y="114" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="126" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"an"</text><text x="82" y="126" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">a is a vowel</text><text x="212" y="126" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">count("n")</text><rect x="10" y="136" width="62" height="18" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.2"/><text x="41" y="148" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">"n"</text><text x="82" y="148" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">n is a consonant</text><text x="212" y="148" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">1 + count("")</text><rect x="10" y="158" width="62" height="18" rx="3" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.2"/><text x="41" y="170" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">""</text><text x="82" y="170" font-size="8.35" text-anchor="start" fill="#222" font-weight="normal" font-style="normal">BASE CASE</text><text x="212" y="170" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">return 0</text><rect x="318" y="26" width="144" height="160" rx="4" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="390" y="40" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Going back up (unwinding):</text><text x="390" y="55" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("")    = 0</text><text x="390" y="70" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("n")   = 1 + 0 = 1</text><text x="390" y="85" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("an")  = 1</text><text x="390" y="100" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("tan") = 1 + 1 = 2</text><text x="390" y="115" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("utan")= 2</text><text x="390" y="130" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("hutan")= 1 + 2 = 3</text><text x="390" y="145" font-size="7.66" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">count("Bhutan")= 1 + 3 = 4</text><text x="390" y="176" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">Answer: 4 (B, h, t, n)</text></svg>