xt x="342" y="116" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="302" y="128" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="342" y="142" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="302" y="154" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="342" y="168" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="388" y="22" width="80" height="22" rx="4" fill="#fff" stroke="#2a7a3a" stroke-width="1.6"/><text x="428" y="37" font-size="8.6" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">SaaS</text><rect x="388" y="50" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="428" y="64" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="388" y="76" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="428" y="90" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="388" y="102" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="428" y="116" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="388" y="128" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="428" y="142" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><rect x="388" y="154" width="80" height="22" rx="0" fill="#cfe3ff" stroke="#666" stroke-width="0.8"/><text x="428" y="168" font-size="7.89" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">provider</text><text x="124" y="64" font-size="8.82" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">Applications</text><text x="124" y="90" font-size="8.82" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">Data</text><text x="124" y="116" font-size="8.82" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">Runtime / middleware</text><text x="124" y="142" font-size="8.82" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">Operating system</text><text x="124" y="168" font-size="8.82" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">Servers, storage, network</text><text x="235" y="190" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Examples: IaaS = virtual servers;  PaaS = app platform;  SaaS = Google Docs, Gmail.</text><text x="235" y="201" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">SaaS = least work for the user;  IaaS = most control;  PaaS = developers manage only the app and data.</text></svg>