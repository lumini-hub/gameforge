<svg viewBox="0 0 470 214" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Flowchart for the star triangle (P25 Q6e)</text><rect x="106" y="19" width="48" height="18" rx="9" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.4"/><text x="130" y="31" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">Start</text><line x1="130" y1="37" x2="130" y2="46" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="98.0" y="46" width="64" height="18" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="130" y="58" font-size="8.35" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">row = 1</text><line x1="130" y1="64" x2="130" y2="74" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M130,75 L176,92 L130,109 L84,92 Z" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.4"/><text x="130" y="95" font-size="8.12" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">row &lt;= 5 ?</text><line x1="84" y1="92" x2="40" y2="92" stroke="#333" stroke-width="1.4"/><line x1="40" y1="92" x2="40" y2="102" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="16" y="103" width="48" height="18" rx="9" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.4"/><text x="40" y="115" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">Stop</text><text x="62" y="88" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">No</text><line x1="130" y1="109" x2="130" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="138" y="116" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Yes</text><rect x="98.0" y="121" width="64" height="18" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="130" y="133" font-size="8.35" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">col = 1</text><line x1="130" y1="139" x2="130" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M130,151 L176,168 L130,185 L84,168 Z" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.4"/><text x="130" y="171" font-size="8.12" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">col &lt;= row ?</text><line x1="130" y1="185" x2="130" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="138" y="189" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Yes</text><path d="M92,210 L100,192 L170,192 L162,210 Z" fill="#fff4e0" stroke="#a05a00" stroke-width="1.4"/><text x="131" y="204" font-size="8.12" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">print "*"</text><line x1="98" y1="201" x2="52" y2="201" stroke="#333" stroke-width="1.4"/><line x1="52" y1="201" x2="52" y2="168" stroke="#333" stroke-width="1.4"/><line x1="52" y1="168" x2="84" y2="168" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="30" y="188" font-size="7.66" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">col = col + 1</text><line x1="176" y1="168" x2="220" y2="168" stroke="#333" stroke-width="1.4"/><text x="198" y="163" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">No</text><line x1="220" y1="168" x2="220" y2="135" stroke="#333" stroke-width="1.4"/><line x1="220" y1="135" x2="232" y2="135" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M230,144 L238,126 L308,126 L300,144 Z" fill="#fff4e0" stroke="#a05a00" stroke-width="1.4"/><text x="269" y="138" font-size="8.12" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">print newline</text><line x1="268" y1="144" x2="268" y2="154" stroke="#333" stroke-width="1.4"/><rect x="229.0" y="154" width="78" height="18" rx="0" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="268" y="166" font-size="8.35" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">row = row + 1</text><line x1="268" y1="172" x2="268" y2="190" stroke="#333" stroke-width="1.4"/><line x1="268" y1="190" x2="318" y2="190" stroke="#333" stroke-width="1.4"/><line x1="318" y1="190" x2="318" y2="92" stroke="#333" stroke-width="1.4"/><line x1="318" y1="92" x2="176" y2="92" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="336" y="26" width="128" height="108" rx="4" fill="#fff" stroke="#9db7d4" stroke-width="1"/><text x="400" y="40" font-size="8.82" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Python version</text><text x="342" y="54" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">row = 1</text><text x="342" y="64" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">while row &lt;= 5:</text><text x="342" y="74" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    col = 1</text><text x="342" y="84" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    while col &lt;= row:</text><text x="342" y="94" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">        print("*", end="")</text><text x="342" y="104" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">        col += 1</text><text x="342" y="114" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    print()</text><text x="342" y="124" font-size="7.66" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    row += 1</text></svg>