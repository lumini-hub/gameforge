<svg viewBox="0 0 470 182" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Common Excel functions</text><rect x="6" y="22" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="35" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">SUM / AVERAGE / MAX / MIN / COUNT</text><rect x="196" y="22" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="35" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=MAX(E2:E5), =AVERAGE(B2:E2)</text><rect x="6" y="44" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="57" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">IF</text><rect x="196" y="44" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="57" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=IF(B2&gt;=50,"Pass","Fail")</text><rect x="6" y="66" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="79" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">AND / OR / NOT</text><rect x="196" y="66" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="79" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=NOT(A1&gt;5)  reverses TRUE/FALSE</text><rect x="6" y="88" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="101" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">SUMIF</text><rect x="196" y="88" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="101" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=SUMIF(B2:B6,"IT",C2:C6)  range, criteria, sum range</text><rect x="6" y="110" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="123" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">COUNTIF / AVERAGEIF</text><rect x="196" y="110" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="123" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=COUNTIF(A1:A6,"&gt;60")</text><rect x="6" y="132" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="145" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">VLOOKUP</text><rect x="196" y="132" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="145" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=VLOOKUP(value, table, col, FALSE)</text><rect x="6" y="154" width="190" height="19" rx="0" fill="#d6e5f4" stroke="#555" stroke-width="0.8"/><text x="12" y="167" font-size="8.35" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">RANK</text><rect x="196" y="154" width="264" height="19" rx="0" fill="#fff" stroke="#555" stroke-width="0.8"/><text x="202" y="167" font-size="7.42" font-family="DejaVu Sans Mono, monospace">=RANK(B2,B2:B10)  position in a list (not alphabetical)</text></svg>