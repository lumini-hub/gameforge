<svg viewBox="0 0 470 168" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Turtle: a regular polygon turns 360° / sides</text><path d="M120.0,28.0 L165.0,54.0 L165.0,106.0 L120.0,132.0 L75.0,106.0 L75.0,54.0 Z" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="2"/><circle cx="120.0" cy="28.0" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><circle cx="165.03332099679082" cy="54.0" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><circle cx="165.03332099679082" cy="106.0" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><circle cx="120.0" cy="132.0" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><circle cx="74.96667900320918" cy="106.0" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><circle cx="74.9666790032092" cy="53.99999999999999" r="3" fill="#b3211b" stroke="#b3211b" stroke-width="0"/><text x="120" y="82" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">hexagon</text><rect x="240" y="26" width="218" height="112" rx="3" fill="#f7f7f7" stroke="#888" stroke-width="1"/><text x="250" y="44" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">import turtle</text><text x="250" y="58" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">t = turtle.Turtle()</text><text x="250" y="72" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">for _ in range(6):</text><text x="250" y="86" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    t.forward(100)</text><text x="250" y="100" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    t.right(60)</text><text x="250" y="114" font-size="8.0" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">turtle.done()</text><text x="349" y="134.0" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">6 sides, turns of 60° → HEXAGON (P24 Q1a(ix): D)</text><text x="235" y="158" font-size="7.89" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Square: 4 sides, turn 90° (360/4).   Triangle: turn 120°.   Pentagon: 72°.   Octagon: 45°.</text></svg>