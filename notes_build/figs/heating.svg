<svg viewBox="0 0 600 260" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><line x1="70" y1="210" x2="550" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="70" y1="210" x2="70" y2="14" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="310.0" y="238" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">heat supplied / time (constant heating rate)</text><text x="24" y="110" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal" transform="rotate(-90 24 110)">temperature (C)</text><line x1="66" y1="150" x2="550" y2="150" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/><text x="62" y="154" font-size="10" text-anchor="end" fill="#1d1d1d" font-weight="normal" font-style="normal">0</text><line x1="66" y1="55" x2="550" y2="55" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/><text x="62" y="59" font-size="10" text-anchor="end" fill="#1d1d1d" font-weight="normal" font-style="normal">100</text><polyline points="70,190 150,150 260,150 360,55 490,55 540,30" fill="none" stroke="#1b3a6b" stroke-width="3"/><text x="110" y="165" font-size="10" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">ice warms</text><text x="205" y="142" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">ice melts</text><text x="205" y="164" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="normal" font-style="normal">latent heat of fusion</text><text x="205" y="177" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">(temperature constant)</text><text x="290" y="140" font-size="10" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">water warms</text><text x="425" y="47" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">water boils</text><text x="425" y="69" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="normal" font-style="normal">latent heat of vaporisation</text><text x="425" y="82" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">(temperature constant)</text><text x="540" y="15" font-size="10" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">steam</text></svg>