<svg viewBox="0 0 600 262" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><path d="M120,190 L120,120 L170,120 L170,170 L360,170 L360,100 L470,100 L470,190 Z" fill="#cfe6fb" stroke="#444" stroke-width="2.5"/><rect x="120" y="100" width="50" height="20" rx="0" fill="#999" stroke="#333" stroke-width="1.5"/><line x1="145" y1="100" x2="145" y2="60" stroke="#333" stroke-width="4"/><rect x="360" y="80" width="110" height="20" rx="0" fill="#999" stroke="#333" stroke-width="1.5"/><line x1="415" y1="80" x2="415" y2="55" stroke="#333" stroke-width="6"/><rect x="350" y="40" width="130" height="15" rx="0" fill="#777" stroke="#333" stroke-width="1.5"/><line x1="145" y1="20" x2="145" y2="56" stroke="#b3261e" stroke-width="3" marker-end="url(#a)"/><text x="160" y="30" font-size="11" text-anchor="start" fill="#b3261e" font-weight="bold" font-style="normal">F1 (small effort)</text><line x1="415" y1="100" x2="415" y2="70" stroke="#1b3a6b" stroke-width="3" marker-end="url(#a)"/><text x="415" y="30" font-size="11" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">F2 (large load)</text><text x="145" y="207" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">small piston, area A1</text><text x="415" y="207" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">large piston, area A2</text><text x="250" y="150" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="normal" font-style="italic">liquid (incompressible)</text><text x="300" y="232" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Pascal's law:  P1 = P2   =>   F1 / A1 = F2 / A2   =>   F2 = F1 x (A2 / A1)</text><text x="300" y="250" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">A2 > A1  =>  F2 > F1 : the machine is a FORCE MULTIPLIER (work in = work out: F1 d1 = F2 d2)</text></svg>