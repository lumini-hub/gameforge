<svg viewBox="0 0 600 255" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="150" y="22" font-size="13" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Moment of a force</text><circle cx="70" cy="110" r="16" fill="#bbb" stroke="#333" stroke-width="1.6"/><rect x="70" y="103" width="160" height="14" rx="4" fill="#cfcfcf" stroke="#555" stroke-width="1.5"/><line x1="222" y1="160" x2="222" y2="122" stroke="#b3261e" stroke-width="2.5" marker-end="url(#a)"/><text x="236" y="150" font-size="12" text-anchor="start" fill="#b3261e" font-weight="bold" font-style="normal">F</text><line x1="70" y1="150" x2="222" y2="150" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="146" y="168" font-size="10" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">perpendicular distance d</text><text x="150" y="200" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Moment = F x d (about the nut)</text><text x="150" y="217" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">one force: also tends to move the body</text><text x="450" y="22" font-size="13" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Moment of a couple</text><circle cx="450" cy="110" r="62" fill="none" stroke="#555" stroke-width="5"/><circle cx="450" cy="110" r="7" fill="#555" stroke="#333" stroke-width="1.6"/><line x1="450" y1="48" x2="450" y2="172" stroke="#555" stroke-width="3"/><line x1="388" y1="110" x2="512" y2="110" stroke="#555" stroke-width="3"/><line x1="388" y1="135" x2="388" y2="85" stroke="#b3261e" stroke-width="2.5" marker-end="url(#a)"/><text x="372" y="112" font-size="12" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">F</text><line x1="512" y1="85" x2="512" y2="135" stroke="#b3261e" stroke-width="2.5" marker-end="url(#a)"/><text x="528" y="112" font-size="12" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">F</text><line x1="388" y1="188" x2="512" y2="188" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="512" y1="188" x2="388" y2="188" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="450" y="204" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">d</text><text x="450" y="226" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Moment of couple = F x d (d = distance between the forces)</text><text x="450" y="243" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">two equal, opposite, parallel forces: net force = 0, pure rotation</text></svg>