<svg viewBox="0 0 600 235" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><path d="M30,70 Q100,150 170,70" fill="none" stroke="#555" stroke-width="3"/><circle cx="100" cy="112" r="13" fill="#7aa6d8" stroke="#1b3a6b" stroke-width="1.6"/><line x1="70" y1="108" x2="52" y2="92" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/><line x1="130" y1="108" x2="148" y2="92" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/><path d="M230,130 Q300,50 370,130" fill="none" stroke="#555" stroke-width="3"/><circle cx="300" cy="63" r="13" fill="#7aa6d8" stroke="#1b3a6b" stroke-width="1.6"/><line x1="318" y1="74" x2="340" y2="100" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/><line x1="282" y1="74" x2="260" y2="100" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/><line x1="430" y1="125" x2="570" y2="125" stroke="#555" stroke-width="3"/><circle cx="500" cy="112" r="13" fill="#7aa6d8" stroke="#1b3a6b" stroke-width="1.6"/><circle cx="540" cy="112" r="13" fill="none" stroke="#999" stroke-width="1.2"/><line x1="515" y1="112" x2="526" y2="112" stroke="#8a4b00" stroke-width="2" marker-end="url(#a)"/><text x="100" y="170" font-size="12" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">STABLE equilibrium</text><text x="100" y="187" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">returns to original position</text><text x="300" y="170" font-size="12" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">UNSTABLE equilibrium</text><text x="300" y="187" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">falls further away</text><text x="500" y="170" font-size="12" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">NEUTRAL equilibrium</text><text x="500" y="187" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">stays in the new position</text><text x="100" y="205" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">C.G. rises when displaced</text><text x="300" y="205" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">C.G. falls when displaced</text><text x="500" y="205" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">C.G. stays at the same height</text><text x="100" y="222" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">(bottle standing upright)</text><text x="300" y="222" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">(pencil on its tip)</text><text x="500" y="222" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">(bottle lying on its side, ball)</text></svg>