<svg viewBox="0 0 600 240" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="110" y="20" font-size="13" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">More STABLE</text><text x="110" y="36" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">low C.G., wide base</text><polygon points="40,170 180,170 110,90" fill="#dbe7f7" stroke="#1b3a6b" stroke-width="1.8"/><circle cx="110" cy="148" r="4.5" fill="#b3261e" stroke="#b3261e" stroke-width="1.6"/><text x="124" y="146" font-size="10" text-anchor="start" fill="#b3261e" font-weight="normal" font-style="normal">C.G.</text><line x1="110" y1="148" x2="110" y2="188" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="110" y="202" font-size="10" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">line of action falls well inside base</text><text x="300" y="20" font-size="13" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">LESS STABLE</text><text x="300" y="36" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">high C.G., narrow base</text><rect x="270" y="60" width="60" height="110" rx="0" fill="#f7dcdc" stroke="#1b3a6b" stroke-width="1.6"/><circle cx="300" cy="90" r="4.5" fill="#b3261e" stroke="#b3261e" stroke-width="1.6"/><text x="314" y="88" font-size="10" text-anchor="start" fill="#b3261e" font-weight="normal" font-style="normal">C.G.</text><line x1="300" y1="90" x2="300" y2="188" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="300" y="202" font-size="10" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">close to the edge of the base</text><text x="500" y="20" font-size="13" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">Toppling</text><text x="500" y="36" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">line of action leaves the base</text><polygon points="470,170 535,150 585,100 520,80" fill="#fff1d6" stroke="#1b3a6b" stroke-width="1.8"/><line x1="450" y1="170" x2="560" y2="170" stroke="#555" stroke-width="2"/><circle cx="528" cy="112" r="4.5" fill="#b3261e" stroke="#b3261e" stroke-width="1.6"/><line x1="528" y1="112" x2="528" y2="188" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="500" y="202" font-size="10" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">falls outside base -> topples</text><text x="300" y="228" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Stability increases with: LOWER centre of gravity  +  LARGER base area</text></svg>