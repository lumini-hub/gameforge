<svg viewBox="0 0 620 255" width="620" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><line x1="65" y1="190" x2="285" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="65" y1="190" x2="65" y2="32" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="285" y="206" font-size="12" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">I</text><text x="55" y="36" font-size="12" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">V</text><line x1="65" y1="190" x2="265" y2="55" stroke="#1b3a6b" stroke-width="3"/><text x="175" y="18" font-size="9.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">OHMIC conductor (e.g. copper wire at constant temperature)</text><text x="175" y="226" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">straight line through origin: V / I = constant</text><line x1="365" y1="190" x2="585" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="365" y1="190" x2="365" y2="32" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="585" y="206" font-size="12" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">I</text><text x="355" y="36" font-size="12" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">V</text><path d="M365,190 Q515,175 565,55" fill="none" stroke="#1b3a6b" stroke-width="3"/><text x="475" y="18" font-size="9.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">NON-OHMIC conductor (e.g. filament lamp, diode)</text><text x="475" y="226" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">curve: resistance changes with V and I</text></svg>