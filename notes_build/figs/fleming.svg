<svg viewBox="0 0 620 242" width="620" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="170" y="16" font-size="11.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Fleming's LEFT-hand rule (MOTOR effect)</text><line x1="150" y1="105" x2="150" y2="43" stroke="#0f6b63" stroke-width="3.5" marker-end="url(#a)"/><text x="158" y="43" font-size="10.5" text-anchor="start" fill="#0f6b63" font-weight="bold" font-style="normal">Thumb</text><line x1="150" y1="105" x2="230" y2="105" stroke="#b3261e" stroke-width="3.5" marker-end="url(#a)"/><text x="234" y="109" font-size="10.5" text-anchor="start" fill="#b3261e" font-weight="bold" font-style="normal">First finger</text><line x1="150" y1="105" x2="98" y2="155" stroke="#8a4b00" stroke-width="3.5" marker-end="url(#a)"/><text x="94" y="171" font-size="10.5" text-anchor="end" fill="#8a4b00" font-weight="bold" font-style="normal">Second finger</text><text x="170" y="188" font-size="10.5" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">Thumb = FORCE (motion)</text><text x="170" y="202" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">First finger = magnetic FIELD (N to S)</text><text x="170" y="216" font-size="10.5" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">Second finger = CURRENT</text><text x="170" y="232" font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="italic">current-carrying conductor in a field</text><text x="470" y="16" font-size="11.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Fleming's RIGHT-hand rule (GENERATOR effect)</text><line x1="450" y1="105" x2="450" y2="43" stroke="#0f6b63" stroke-width="3.5" marker-end="url(#a)"/><text x="458" y="43" font-size="10.5" text-anchor="start" fill="#0f6b63" font-weight="bold" font-style="normal">Thumb</text><line x1="450" y1="105" x2="530" y2="105" stroke="#b3261e" stroke-width="3.5" marker-end="url(#a)"/><text x="534" y="109" font-size="10.5" text-anchor="start" fill="#b3261e" font-weight="bold" font-style="normal">First finger</text><line x1="450" y1="105" x2="398" y2="155" stroke="#8a4b00" stroke-width="3.5" marker-end="url(#a)"/><text x="394" y="171" font-size="10.5" text-anchor="end" fill="#8a4b00" font-weight="bold" font-style="normal">Second finger</text><text x="470" y="188" font-size="10.5" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">Thumb = MOTION of the conductor</text><text x="470" y="202" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">First finger = magnetic FIELD (N to S)</text><text x="470" y="216" font-size="10.5" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">Second finger = INDUCED CURRENT</text><text x="470" y="232" font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="italic">conductor moved in a field</text></svg>