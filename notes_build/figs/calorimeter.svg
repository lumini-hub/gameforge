<svg viewBox="0 0 640 255" width="640" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="150" y="70" width="190" height="150" rx="0" fill="#fff3cd" stroke="#555" stroke-width="2"/><rect x="172" y="90" width="146" height="130" rx="0" fill="#ddd" stroke="#555" stroke-width="2"/><rect x="184" y="118" width="122" height="100" rx="0" fill="#bfe3f5" stroke="#1b3a6b" stroke-width="1.5"/><line x1="190" y1="70" x2="300" y2="70" stroke="#555" stroke-width="6"/><line x1="245" y1="60" x2="262" y2="200" stroke="#222" stroke-width="3"/><circle cx="245" cy="55" r="6" fill="none" stroke="#222" stroke-width="2.5"/><line x1="280" y1="30" x2="280" y2="200" stroke="#555" stroke-width="1.6"/><circle cx="280" cy="205" r="10" fill="none" stroke="#555" stroke-width="2"/><line x1="385" y1="76" x2="300" y2="70" stroke="#999" stroke-width="1"/><text x="390" y="80" font-size="10.5" text-anchor="start" fill="#1b3a6b" font-weight="bold" font-style="normal">lid with holes (stops convection / evaporation)</text><line x1="385" y1="111" x2="262" y2="120" stroke="#999" stroke-width="1"/><text x="390" y="115" font-size="10.5" text-anchor="start" fill="#1b3a6b" font-weight="bold" font-style="normal">thermometer</text><line x1="385" y1="144" x2="281" y2="150" stroke="#999" stroke-width="1"/><text x="390" y="148" font-size="10.5" text-anchor="start" fill="#1b3a6b" font-weight="bold" font-style="normal">stirrer (keeps temperature even)</text><line x1="385" y1="178" x2="306" y2="190" stroke="#999" stroke-width="1"/><text x="390" y="182" font-size="10.5" text-anchor="start" fill="#1b3a6b" font-weight="bold" font-style="normal">inner shiny copper vessel (low radiation)</text><text x="80" y="122" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">outer jacket</text><text x="80" y="140" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">with insulating</text><text x="80" y="153" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">lagging (felt /</text><text x="80" y="166" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">cotton wool)</text><line x1="150" y1="160" x2="118" y2="160" stroke="#999" stroke-width="1"/><text x="160" y="240" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">air gap between the vessels (poor conductor)</text><text x="300" y="18" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Calorimeter: principle  heat lost by hot body = heat gained by cold body</text></svg>