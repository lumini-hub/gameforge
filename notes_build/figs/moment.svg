<svg viewBox="0 0 600 295" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><polygon points="300,150 280,185 320,185" fill="#ddd" stroke="#333" stroke-width="1.8"/><line x1="60" y1="150" x2="540" y2="150" stroke="#8a4b00" stroke-width="7"/><line x1="60" y1="185" x2="540" y2="185" stroke="#888" stroke-width="1"/><line x1="190" y1="100" x2="190" y2="145" stroke="#b3261e" stroke-width="2.5" marker-end="url(#a)"/><text x="190" y="92" font-size="11" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">Pema 250 N</text><line x1="480" y1="100" x2="480" y2="145" stroke="#1b3a6b" stroke-width="2.5" marker-end="url(#a)"/><text x="480" y="92" font-size="11" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Dema 450 N</text><line x1="190" y1="208" x2="298" y2="208" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="298" y1="208" x2="190" y2="208" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="244" y="224" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">d = ? (3.6 m)</text><line x1="302" y1="208" x2="480" y2="208" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="480" y1="208" x2="302" y2="208" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="391" y="224" font-size="11" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">2 m</text><text x="300" y="205" font-size="10" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal"></text><text x="300" y="260" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Principle of moments:  clockwise moment = anticlockwise moment</text><text x="300" y="280" font-size="12" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">450 N x 2 m = 250 N x d   =>   d = 900 / 250 = 3.6 m</text><text x="300" y="125" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">pivot</text><line x1="300" y1="128" x2="300" y2="146" stroke="#666" stroke-width="1" marker-end="url(#a)"/></svg>