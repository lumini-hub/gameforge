<svg viewBox="0 0 600 240" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="130" y="18" font-size="12" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">STEP-UP transformer</text><rect x="90" y="40" width="80" height="120" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/><rect x="108" y="58" width="44" height="84" rx="0" fill="#fff" stroke="#455a64" stroke-width="1.5"/><line x1="86" y1="62.0" x2="114" y2="65.0" stroke="#8a4b00" stroke-width="2.2"/><line x1="86" y1="86.66666666666667" x2="114" y2="89.66666666666667" stroke="#8a4b00" stroke-width="2.2"/><line x1="86" y1="111.33333333333334" x2="114" y2="114.33333333333334" stroke="#8a4b00" stroke-width="2.2"/><line x1="86" y1="136.0" x2="114" y2="139.0" stroke="#8a4b00" stroke-width="2.2"/><line x1="146" y1="62.0" x2="174" y2="65.0" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="71.25" x2="174" y2="74.25" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="80.5" x2="174" y2="83.5" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="89.75" x2="174" y2="92.75" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="99.0" x2="174" y2="102.0" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="108.25" x2="174" y2="111.25" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="117.5" x2="174" y2="120.5" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="126.75" x2="174" y2="129.75" stroke="#0f6b63" stroke-width="2.2"/><line x1="146" y1="136.0" x2="174" y2="139.0" stroke="#0f6b63" stroke-width="2.2"/><text x="55" y="105" font-size="10.5" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">Primary</text><text x="55" y="118" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">4 turns (Np)</text><text x="205" y="105" font-size="10.5" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">Secondary</text><text x="205" y="118" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">9 turns (Ns)</text><text x="130" y="180" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Ns > Np  =>  Vs > Vp (current falls)</text><text x="430" y="18" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">STEP-DOWN transformer</text><rect x="390" y="40" width="80" height="120" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/><rect x="408" y="58" width="44" height="84" rx="0" fill="#fff" stroke="#455a64" stroke-width="1.5"/><line x1="386" y1="62.0" x2="414" y2="65.0" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="71.25" x2="414" y2="74.25" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="80.5" x2="414" y2="83.5" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="89.75" x2="414" y2="92.75" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="99.0" x2="414" y2="102.0" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="108.25" x2="414" y2="111.25" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="117.5" x2="414" y2="120.5" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="126.75" x2="414" y2="129.75" stroke="#8a4b00" stroke-width="2.2"/><line x1="386" y1="136.0" x2="414" y2="139.0" stroke="#8a4b00" stroke-width="2.2"/><line x1="446" y1="62.0" x2="474" y2="65.0" stroke="#0f6b63" stroke-width="2.2"/><line x1="446" y1="86.66666666666667" x2="474" y2="89.66666666666667" stroke="#0f6b63" stroke-width="2.2"/><line x1="446" y1="111.33333333333334" x2="474" y2="114.33333333333334" stroke="#0f6b63" stroke-width="2.2"/><line x1="446" y1="136.0" x2="474" y2="139.0" stroke="#0f6b63" stroke-width="2.2"/><text x="355" y="105" font-size="10.5" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">Primary</text><text x="355" y="118" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">9 turns (Np)</text><text x="505" y="105" font-size="10.5" text-anchor="middle" fill="#0f6b63" font-weight="bold" font-style="normal">Secondary</text><text x="505" y="118" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">4 turns (Ns)</text><text x="430" y="180" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Ns < Np  =>  Vs < Vp (current rises)</text><text x="300" y="212" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Vs / Vp = Ns / Np      and, for an ideal (100% efficient) transformer:   Vp Ip = Vs Is</text><text x="300" y="230" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">Works only with AC: a changing current in the primary changes the magnetic flux in the iron core and induces an emf in the secondary.</text></svg>