<svg viewBox="0 0 600 215" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="10" y="50" width="82" height="50" rx="0" fill="#ffcdd2" stroke="#555" stroke-width="1.4"/><text x="51.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Radio waves</text><text x="51.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">radio, TV,</text><text x="51.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">broadcasting</text><rect x="92" y="50" width="82" height="50" rx="0" fill="#ffe0b2" stroke="#555" stroke-width="1.4"/><text x="133.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Microwaves</text><text x="133.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">mobile phones,</text><text x="133.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">Wi-Fi, satellite,</text><text x="133.0" y="142" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">oven</text><rect x="174" y="50" width="82" height="50" rx="0" fill="#fff9c4" stroke="#555" stroke-width="1.4"/><text x="215.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Infrared</text><text x="215.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">remote control,</text><text x="215.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">night vision,</text><text x="215.0" y="142" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">heating</text><rect x="256" y="50" width="82" height="50" rx="0" fill="#c8e6c9" stroke="#555" stroke-width="1.4"/><text x="297.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Visible</text><text x="297.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">seeing,</text><text x="297.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">photography</text><rect x="338" y="50" width="82" height="50" rx="0" fill="#bbdefb" stroke="#555" stroke-width="1.4"/><text x="379.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Ultraviolet</text><text x="379.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">sterilising,</text><text x="379.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">fake-note</text><text x="379.0" y="142" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">detector</text><rect x="420" y="50" width="82" height="50" rx="0" fill="#d1c4e9" stroke="#555" stroke-width="1.4"/><text x="461.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">X-rays</text><text x="461.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">medical</text><text x="461.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">imaging,</text><text x="461.0" y="142" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">security</text><rect x="502" y="50" width="82" height="50" rx="0" fill="#f8bbd0" stroke="#555" stroke-width="1.4"/><text x="543.0" y="80" font-size="10.5" text-anchor="middle" fill="#1d1d1d" font-weight="bold" font-style="normal">Gamma rays</text><text x="543.0" y="118" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">cancer therapy,</text><text x="543.0" y="130" font-size="9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">sterilising</text><line x1="14" y1="36" x2="580" y2="36" stroke="#b3261e" stroke-width="2.2" marker-end="url(#a)"/><text x="14" y="28" font-size="10.5" text-anchor="start" fill="#b3261e" font-weight="bold" font-style="normal">frequency and energy INCREASE</text><line x1="580" y1="168" x2="14" y2="168" stroke="#1b3a6b" stroke-width="2.2" marker-end="url(#a)"/><text x="580" y="184" font-size="10.5" text-anchor="end" fill="#1b3a6b" font-weight="bold" font-style="normal">wavelength DECREASES</text><text x="300" y="18" font-size="11.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">The electromagnetic spectrum:  c = f x lambda   (all travel at 3 x 10^8 m/s in vacuum)</text><text x="300" y="205" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">RADIO (longest wavelength, ~1 m - km)  ->  GAMMA (shortest wavelength, < 10^-11 m)</text></svg>