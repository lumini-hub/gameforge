<svg viewBox="0 0 620 205" width="620" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="20" y="100" width="60" height="50" rx="0" fill="#9e9e9e" stroke="#444" stroke-width="2"/><rect x="32" y="100" width="36" height="28" rx="0" fill="#e0e0e0" stroke="#444" stroke-width="1"/><circle cx="50" cy="140" r="6" fill="#ffee58" stroke="#f57f17" stroke-width="1.6"/><text x="50" y="168" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">source in lead</text><text x="300" y="14" font-size="12" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">Penetrating power: alpha < beta < gamma</text><rect x="180" y="38" width="16" height="110" rx="0" fill="#fff8e1" stroke="#444" stroke-width="1.6"/><text x="188" y="164" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">paper</text><rect x="270" y="38" width="16" height="110" rx="0" fill="#cfd8dc" stroke="#444" stroke-width="1.6"/><text x="278" y="164" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">aluminium (few mm)</text><rect x="360" y="38" width="30" height="110" rx="0" fill="#757575" stroke="#444" stroke-width="1.6"/><text x="368" y="164" font-size="9.5" text-anchor="middle" fill="#1d1d1d" font-weight="normal" font-style="normal">thick lead / concrete</text><line x1="80" y1="60" x2="178" y2="60" stroke="#b3261e" stroke-width="3" marker-end="url(#a)"/><text x="130" y="52" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">alpha</text><line x1="80" y1="90" x2="268" y2="90" stroke="#8a4b00" stroke-width="3" marker-end="url(#a)"/><text x="160" y="84" font-size="10.5" text-anchor="middle" fill="#8a4b00" font-weight="bold" font-style="normal">beta</text><line x1="80" y1="125" x2="440" y2="125" stroke="#0f6b63" stroke-width="3" marker-end="url(#a)"/><text x="120" y="119" font-size="10.5" text-anchor="start" fill="#0f6b63" font-weight="bold" font-style="normal">gamma (only thick lead reduces it)</text><text x="300" y="190" font-size="10.5" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">STOPPED by: alpha - paper / skin  |  beta - few mm aluminium  |  gamma - thick lead / concrete</text><text x="530" y="32" font-size="11" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">In an electric field</text><line x1="480" y1="50" x2="480" y2="135" stroke="#b3261e" stroke-width="3"/><text x="480" y="46" font-size="13" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="normal">+</text><line x1="580" y1="50" x2="580" y2="135" stroke="#1b3a6b" stroke-width="3"/><text x="580" y="46" font-size="14" text-anchor="middle" fill="#1b3a6b" font-weight="bold" font-style="normal">-</text><path d="M530,150 Q528,110 484,60" fill="none" stroke="#8a4b00" stroke-width="2.4" marker-end="url(#a)"/><text x="498" y="82" font-size="9.5" text-anchor="middle" fill="#8a4b00" font-weight="normal" font-style="normal">beta</text><line x1="530" y1="150" x2="530" y2="55" stroke="#0f6b63" stroke-width="2.4" marker-end="url(#a)"/><text x="536" y="84" font-size="9.5" text-anchor="start" fill="#0f6b63" font-weight="normal" font-style="normal">gamma</text><path d="M530,150 Q532,110 566,60" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#a)"/><text x="564" y="78" font-size="9.5" text-anchor="start" fill="#b3261e" font-weight="normal" font-style="normal">alpha</text><text x="530" y="168" font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">alpha(+) bends to -, beta(-) to +</text><text x="530" y="180" font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">gamma: no charge, not deflected</text></svg>