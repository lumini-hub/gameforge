<svg viewBox="0 0 470 205" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><circle cx="120" cy="105" r="92" fill="#b7794a" stroke="#444" stroke-width="1.6"/><circle cx="120" cy="105" r="88" fill="#e08a3c" stroke="#444" stroke-width="1.2"/><circle cx="120" cy="105" r="52" fill="#f4c24a" stroke="#444" stroke-width="1.2"/><circle cx="120" cy="105" r="26" fill="#fff3b0" stroke="#444" stroke-width="1.2"/><text x="120" y="108" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">inner</text><text x="120" y="116" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">core</text><text x="120" y="69" font-size="7.6" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">outer core</text><text x="120" y="167" font-size="8.4" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">MANTLE</text><text x="238" y="20" font-size="8.6" text-anchor="start" fill="#b3211b" font-weight="bold" font-style="normal">CRUST</text><text x="238" y="31" font-size="6.7" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">5-10 km (oceanic), 30-70 km (continental); solid rock</text><text x="238" y="54" font-size="8.6" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">MANTLE</text><text x="238" y="65" font-size="6.7" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">about 2,900 km thick; hot, slowly flowing rock</text><text x="238" y="88" font-size="8.6" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">OUTER CORE</text><text x="238" y="99" font-size="6.7" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">about 2,200 km; liquid iron and nickel (makes the magnetic field)</text><text x="238" y="122" font-size="8.6" text-anchor="start" fill="#0e3a66" font-weight="bold" font-style="normal">INNER CORE</text><text x="238" y="133" font-size="6.7" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">about 1,200 km; solid iron-nickel, ~5,500 C</text><rect x="236" y="138" width="226" height="38" rx="3" fill="#eef3fb" stroke="#0e3a66" stroke-width="1.2"/><text x="349" y="152" font-size="7.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">LITHOSPHERE = crust + rigid top of mantle (~100 km)</text><text x="349" y="166" font-size="7.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">floats on the ASTHENOSPHERE (weak, ductile layer)</text></svg>