<svg viewBox="0 0 470 198" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="10" y="20" width="330" height="150" rx="2" fill="#e9e2d0" stroke="#8a7a55" stroke-width="1.5"/><path d="M60,20 L60,50 L66,50 L66,20" fill="#bfe3f5" stroke="#2f6fb0" stroke-width="1"/><text x="63" y="14" font-size="6.8" text-anchor="middle" fill="#2f6fb0" font-weight="normal" font-style="normal">swallow hole</text><path d="M190,20 Q196,48 210,48 Q224,48 230,20" fill="#e3d9b9" stroke="#8a7a55" stroke-width="1.4"/><text x="210" y="14" font-size="6.8" text-anchor="middle" fill="#8a5a1c" font-weight="normal" font-style="normal">sinkhole (doline)</text><line x1="20" y1="22" x2="23" y2="28" stroke="#8a7a55" stroke-width="1"/><line x1="28" y1="22" x2="31" y2="28" stroke="#8a7a55" stroke-width="1"/><line x1="36" y1="22" x2="39" y2="28" stroke="#8a7a55" stroke-width="1"/><line x1="44" y1="22" x2="47" y2="28" stroke="#8a7a55" stroke-width="1"/><line x1="52" y1="22" x2="55" y2="28" stroke="#8a7a55" stroke-width="1"/><text x="30" y="34" font-size="6.8" text-anchor="middle" fill="#8a5a1c" font-weight="normal" font-style="normal">lapies</text><path d="M30,100 Q40,70 100,72 Q250,70 300,92 L300,152 L30,152 Z" fill="#cfe0ee" stroke="#666" stroke-width="1.2"/><polygon points="73.0,72.0 87.0,72.0 80.0,130.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="123.0,72.0 137.0,72.0 130.0,130.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="193.0,72.0 207.0,72.0 200.0,100.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="243.0,72.0 257.0,72.0 250.0,100.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="102.0,150.0 118.0,150.0 110.0,142.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="162.0,150.0 178.0,150.0 170.0,142.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><polygon points="212.0,150.0 228.0,150.0 220.0,132.0" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><rect x="143" y="74" width="12" height="76" rx="1" fill="#fff7d6" stroke="#8a7a55" stroke-width="1"/><text x="149" y="166" font-size="6.8" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">pillar</text><path d="M30,150 Q150,138 300,150" fill="none" stroke="#2f6fb0" stroke-width="2.2"/><text x="100" y="160" font-size="6.8" text-anchor="middle" fill="#2f6fb0" font-weight="normal" font-style="normal">underground stream</text><text x="105" y="66" font-size="6.8" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">stalactite (hangs from roof)</text><text x="235" y="140" font-size="6.8" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">stalagmite (rises</text><text x="235" y="149" font-size="6.8" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">from floor)</text><text x="10" y="190" font-size="7" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">Limestone dissolves in rainwater (carbonic acid) = EROSION; dripping water re-deposits calcite = DEPOSITION</text><rect x="350" y="24" width="116" height="130" rx="3" fill="#eef3fb" stroke="#0e3a66" stroke-width="1.2"/><text x="408" y="40.0" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">EROSIONAL:</text><text x="408" y="51.4" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">lapies, sinkholes,</text><text x="408" y="62.8" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">swallow holes,</text><text x="408" y="74.2" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">caves, tunnels</text><text x="408" y="85.6" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal"></text><text x="408" y="97.0" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">DEPOSITIONAL:</text><text x="408" y="108.4" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">stalactite,</text><text x="408" y="119.8" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">stalagmite,</text><text x="408" y="131.2" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">pillar (column)</text></svg>