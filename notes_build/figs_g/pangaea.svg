<svg viewBox="0 0 470 56" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="0.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="18" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">~300-200 mya</text><text x="70.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">ALL land joined:</text><text x="70.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">supercontinent PANGAEA</text><text x="70.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">one ocean: Panthalassa</text><line x1="140.0" y1="28.0" x2="164.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="18" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">~200 mya</text><text x="235.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Pangaea splits:</text><text x="235.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">LAURASIA (north) and</text><text x="235.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">GONDWANA (south)</text><line x1="305.0" y1="28.0" x2="329.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="18" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">~65 mya on</text><text x="400.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">continents drift to</text><text x="400.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">present positions;</text><text x="400.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">India hits Eurasia</text></svg>