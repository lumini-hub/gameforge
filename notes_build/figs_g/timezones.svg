<svg viewBox="0 0 470 176" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="8.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Earth turns 360 deg in 24 h: 15 deg = 1 hour, 1 deg = 4 minutes</text><line x1="22" y1="78" x2="450" y2="78" stroke="#333" stroke-width="2.4"/><line x1="68.0" y1="73" x2="68.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="68.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">120W</text><text x="68.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">-8 h</text><line x1="110.00000000000001" y1="73" x2="110.00000000000001" y2="83" stroke="#333" stroke-width="1.4"/><text x="110.00000000000001" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">90W</text><text x="110.00000000000001" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">-6 h</text><line x1="152.0" y1="73" x2="152.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="152.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">60W</text><text x="152.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">-4 h</text><line x1="194.0" y1="73" x2="194.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="194.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">30W</text><text x="194.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">-2 h</text><line x1="236.0" y1="73" x2="236.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="236.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">0 (GMT)</text><text x="236.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">0 h</text><line x1="278.0" y1="73" x2="278.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="278.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">30E</text><text x="278.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">+2 h</text><line x1="320.0" y1="73" x2="320.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="320.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">60E</text><text x="320.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">+4 h</text><line x1="362.0" y1="73" x2="362.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="362.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">90E</text><text x="362.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">+6 h</text><line x1="404.0" y1="73" x2="404.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="404.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">120E</text><text x="404.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">+8 h</text><line x1="446.0" y1="73" x2="446.0" y2="83" stroke="#333" stroke-width="1.4"/><text x="446.0" y="95" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">150E</text><text x="446.0" y="106" font-size="7.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">+10 h</text><circle cx="362.0" cy="78" r="4.5" fill="#b3211b" stroke="#b3211b" stroke-width="1.3"/><text x="362.0" y="44.0" font-size="7.4" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">BHUTAN</text><text x="362.0" y="53.028" font-size="7.4" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">90E = GMT+6</text><circle cx="236" cy="78" r="4.5" fill="#0e3a66" stroke="#0e3a66" stroke-width="1.3"/><text x="236" y="44.0" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">LONDON</text><text x="236" y="53.028" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">0 = GMT</text><circle cx="447.4" cy="78" r="4.5" fill="#5b3a8a" stroke="#5b3a8a" stroke-width="1.3"/><text x="439.4" y="44.0" font-size="7.4" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">SYDNEY</text><text x="439.4" y="53.028" font-size="7.4" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">151E</text><rect x="14" y="118" width="442" height="52" rx="3" fill="#fff7e6" stroke="#b36200" stroke-width="1.2"/><text x="235" y="132" font-size="7.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">EAST of a place = AHEAD in time (+).   WEST = BEHIND (-).</text><text x="235" y="144" font-size="7.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">Time difference = (longitude difference x 4) minutes.   Local time = GMT + (longitude / 15) h.</text><text x="235" y="156" font-size="7.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">Same longitude side: subtract the longitudes; opposite sides (E and W): add them.</text></svg>