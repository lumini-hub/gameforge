<svg viewBox="0 0 470 176" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><polygon points="140.8,108.0 120.0,120.0 99.2,108.0 99.2,84.0 120.0,72.0 140.8,84.0" fill="#fde3a7" stroke="#b36200" stroke-width="1.2"/><polygon points="182.4,108.0 161.6,120.0 140.8,108.0 140.8,84.0 161.6,72.0 182.4,84.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><polygon points="161.6,144.0 140.8,156.0 120.0,144.0 120.0,120.0 140.8,108.0 161.6,120.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><polygon points="120.0,144.0 99.2,156.0 78.4,144.0 78.4,120.0 99.2,108.0 120.0,120.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><polygon points="99.2,108.0 78.4,120.0 57.6,108.0 57.6,84.0 78.4,72.0 99.2,84.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><polygon points="120.0,72.0 99.2,84.0 78.4,72.0 78.4,48.0 99.2,36.0 120.0,48.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><polygon points="161.6,72.0 140.8,84.0 120.0,72.0 120.0,48.0 140.8,36.0 161.6,48.0" fill="#fff7d6" stroke="#b36200" stroke-width="1.2"/><circle cx="161.56921938165306" cy="96.0" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="140.78460969082653" cy="132.0" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="99.21539030917349" cy="132.0" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="78.43078061834694" cy="96.0" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="99.21539030917346" cy="60.00000000000001" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="140.78460969082653" cy="60.0" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><circle cx="182.64000000000001" cy="132.16522086203815" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="120.0" cy="168.3304417240763" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="57.35999999999999" cy="132.16522086203815" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="57.36" cy="59.83477913796183" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="119.99999999999999" cy="23.669558275923677" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="182.64" cy="59.8347791379618" r="2.6" fill="#666" stroke="#666" stroke-width="1.3"/><circle cx="120" cy="96" r="7" fill="#b3211b" stroke="#b3211b" stroke-width="1.3"/><text x="120" y="14" font-size="8.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Christaller's Central Place Theory</text><rect x="250" y="22" width="214" height="140" rx="3" fill="#eef3fb" stroke="#0e3a66" stroke-width="1.2"/><circle cx="262" cy="40" r="4" fill="#b3211b" stroke="#b3211b" stroke-width="1.3"/><text x="272" y="43" font-size="6.8" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">City / large town (high-order goods: hospital, university)</text><circle cx="262" cy="54" r="4" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><text x="272" y="57" font-size="6.8" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">Town (medium goods)</text><circle cx="262" cy="68" r="4" fill="#666" stroke="#666" stroke-width="1.3"/><text x="272" y="71" font-size="6.8" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">Village (low-order: salt, rice, vegetables)</text><text x="357" y="90.0" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">Key ideas:</text><text x="357" y="100.4" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">- people travel SHORT distances for</text><text x="357" y="110.8" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  low-order goods and FAR for high-order</text><text x="357" y="121.2" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">- hexagonal market areas (no gaps/overlap)</text><text x="357" y="131.6" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">- many villages, fewer towns, few cities</text><text x="357" y="142.0" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">- THRESHOLD = minimum customers</text><text x="357" y="152.4" font-size="6.8" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">- RANGE = maximum distance travelled</text></svg>