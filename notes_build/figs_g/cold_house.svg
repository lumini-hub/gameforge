<svg viewBox="0 0 470 176" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><line x1="10" y1="150" x2="300" y2="150" stroke="#6b8e23" stroke-width="4"/><polygon points="60.0,96.0 150.0,58.0 240.0,96.0" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.8"/><text x="150" y="52" font-size="7.4" text-anchor="middle" fill="#8a5a1c" font-weight="bold" font-style="normal">sloped wooden / slate roof</text><rect x="70" y="96" width="160" height="54" rx="0" fill="#e8e1d0" stroke="#6b5a3a" stroke-width="3.2"/><rect x="90" y="112" width="18" height="16" rx="0" fill="#bfe3f5" stroke="#0e3a66" stroke-width="1.4"/><rect x="190" y="112" width="18" height="16" rx="0" fill="#bfe3f5" stroke="#0e3a66" stroke-width="1.4"/><rect x="136" y="118" width="26" height="32" rx="0" fill="#8b5a2b" stroke="#444" stroke-width="1.4"/><line x1="60" y1="80" x2="30" y2="70" stroke="#b3211b" stroke-width="1.2"/><text x="30" y="66" font-size="6.8" text-anchor="middle" fill="#2f6fb0" font-weight="normal" font-style="normal">snow slides off</text><text x="150" y="168" font-size="7.4" text-anchor="middle" fill="#6b5a3a" font-weight="bold" font-style="normal">THICK stone / rammed-earth walls</text><rect x="318" y="22" width="148" height="138" rx="3" fill="#eef3fb" stroke="#0e3a66" stroke-width="1.2"/><text x="392" y="38" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">Why (Lunana / cold areas):</text><text x="392" y="49" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal"></text><text x="392" y="60" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">1 Thick walls store heat</text><text x="392" y="71" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  and block cold wind</text><text x="392" y="82" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">2 Sloped roof sheds snow</text><text x="392" y="93" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  and rain</text><text x="392" y="104" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">3 Light wood/slate roof:</text><text x="392" y="115" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  local, easy to repair</text><text x="392" y="126" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">4 Few, small south-facing</text><text x="392" y="137" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  windows; low ceilings;</text><text x="392" y="148" font-size="6.9" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">  animals below, family above</text></svg>