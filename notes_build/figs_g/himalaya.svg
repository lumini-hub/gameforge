<svg viewBox="0 0 470 142" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="61" y="12" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">1. Tethys Sea</text><rect x="6" y="20" width="110" height="80" rx="2" fill="#e8f2fb" stroke="#999" stroke-width="1"/><rect x="10" y="62" width="30" height="36" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.2"/><rect x="82" y="56" width="30" height="42" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.2"/><text x="61" y="82" font-size="7" text-anchor="middle" fill="#2f6fb0" font-weight="normal" font-style="normal">sea</text><text x="25" y="96" font-size="6.8" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">India</text><text x="97" y="96" font-size="6.8" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Eurasia</text><text x="61" y="112" font-size="6.6" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">India (south) and Eurasia (north)</text><text x="177" y="12" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">2. India drifts north</text><rect x="122" y="20" width="110" height="80" rx="2" fill="#e8f2fb" stroke="#999" stroke-width="1"/><rect x="136" y="62" width="30" height="36" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.2"/><rect x="198" y="56" width="30" height="42" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.2"/><line x1="128" y1="44" x2="158" y2="44" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><path d="M166,96 Q182,84 198,96" fill="#b9d8f0" stroke="#2f6fb0" stroke-width="1.2"/><text x="177" y="112" font-size="6.6" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">sea sediments squeezed</text><text x="293" y="12" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">3. Collision 50-70 mya</text><rect x="238" y="20" width="110" height="80" rx="2" fill="#e8f2fb" stroke="#999" stroke-width="1"/><rect x="242" y="66" width="40" height="32" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.2"/><rect x="304" y="56" width="40" height="42" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.2"/><path d="M278,98 Q288,50 296,72 Q302,42 310,98" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.4"/><line x1="244" y1="50" x2="268" y2="50" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><text x="293" y="112" font-size="6.6" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">crumpling, folding</text><text x="409" y="12" font-size="7.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">4. Himalayas today</text><rect x="354" y="20" width="110" height="80" rx="2" fill="#e8f2fb" stroke="#999" stroke-width="1"/><polygon points="358.0,98.0 358.0,66.0 384.0,58.0 400.0,38.0 410.0,24.0 420.0,36.0 436.0,58.0 460.0,62.0 460.0,98.0" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.4"/><polygon points="404.0,32.0 410.0,24.0 416.0,32.0" fill="#fff" stroke="#aaa" stroke-width="1"/><text x="410" y="18" font-size="1" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal"></text><text x="409" y="112" font-size="6.6" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">still rising ~ 4 mm/yr</text><text x="235" y="134" font-size="7" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">Marine fossils (ammonites, shells) and marine limestone high in the Himalayas prove the area was once under the Tethys Sea.</text></svg>