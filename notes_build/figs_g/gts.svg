<svg viewBox="0 0 470 114" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="6" y="8" width="110" height="24" rx="3" fill="#e5d6f0" stroke="#5b3a8a" stroke-width="1.6"/><text x="61" y="21" font-size="8.2" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">PRECAMBRIAN</text><text x="61" y="30" font-size="6.6" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">4.6 bya - 541 mya</text><rect x="6" y="34" width="110" height="58" rx="3" fill="#fff" stroke="#5b3a8a" stroke-width="1.3"/><text x="61" y="47.0" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Earth forms; crust</text><text x="61" y="57.4" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">oceans, atmosphere;</text><text x="61" y="67.8" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">first simple life</text><text x="61" y="78.2" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(bacteria, algae)</text><line x1="116" y1="20" x2="122" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/><rect x="122" y="8" width="110" height="24" rx="3" fill="#d6ecd9" stroke="#2a7a3a" stroke-width="1.6"/><text x="177" y="21" font-size="8.2" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">PALAEOZOIC</text><text x="177" y="30" font-size="6.6" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">541 - 252 mya</text><rect x="122" y="34" width="110" height="58" rx="3" fill="#fff" stroke="#2a7a3a" stroke-width="1.3"/><text x="177" y="47.0" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">fish, amphibians,</text><text x="177" y="57.4" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">first reptiles;</text><text x="177" y="67.8" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">first land plants,</text><text x="177" y="78.2" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">forests and coal</text><line x1="232" y1="20" x2="238" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/><rect x="238" y="8" width="110" height="24" rx="3" fill="#fbeed6" stroke="#b36200" stroke-width="1.6"/><text x="293" y="21" font-size="8.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">MESOZOIC</text><text x="293" y="30" font-size="6.6" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">252 - 66 mya</text><rect x="238" y="34" width="110" height="58" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.3"/><text x="293" y="47.0" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">age of dinosaurs;</text><text x="293" y="57.4" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Pangaea breaks up;</text><text x="293" y="67.8" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">first mammals, birds;</text><text x="293" y="78.2" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">ends with extinction</text><line x1="348" y1="20" x2="354" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/><rect x="354" y="8" width="110" height="24" rx="3" fill="#dbe7f7" stroke="#0e3a66" stroke-width="1.6"/><text x="409" y="21" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">CENOZOIC</text><text x="409" y="30" font-size="6.6" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">66 mya - today</text><rect x="354" y="34" width="110" height="58" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.3"/><text x="409" y="47.0" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">age of mammals;</text><text x="409" y="57.4" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Himalayas rise;</text><text x="409" y="67.8" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Ice Ages (Pleistocene);</text><text x="409" y="78.2" font-size="7" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">humans appear</text><text x="235" y="106" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Order (oldest to newest): Precambrian -&gt; Palaeozoic -&gt; Mesozoic -&gt; Cenozoic   (i, iii, ii, iv in 2025 Q5a)</text></svg>