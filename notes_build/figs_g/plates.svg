<svg viewBox="0 0 470 140" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="78" y="12" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">CONVERGENT (collide)</text><rect x="8" y="60" width="68" height="28" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.3"/><rect x="80" y="60" width="68" height="28" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><polygon points="58.0,60.0 78.0,32.0 100.0,60.0" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.3"/><line x1="12" y1="48" x2="42" y2="48" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><line x1="144" y1="48" x2="114" y2="48" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><text x="78" y="106.0" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Fold mountains form</text><text x="78" y="114.784" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(Himalayas: India +</text><text x="78" y="123.568" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Eurasia)</text><text x="233" y="12" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">DIVERGENT (move apart)</text><rect x="163" y="60" width="58" height="28" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.3"/><rect x="245" y="60" width="58" height="28" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><rect x="221" y="70" width="24" height="18" rx="1" fill="#e08a3c" stroke="#a34a00" stroke-width="1"/><line x1="215" y1="48" x2="185" y2="48" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><line x1="251" y1="48" x2="281" y2="48" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><text x="233" y="106.0" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Rift valley / ocean ridge;</text><text x="233" y="114.784" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">new crust (sea-floor</text><text x="233" y="123.568" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">spreading)</text><text x="388" y="12" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">TRANSFORM (slide past)</text><rect x="318" y="52" width="66" height="22" rx="1" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.3"/><rect x="392" y="74" width="66" height="22" rx="1" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><line x1="352" y1="44" x2="326" y2="44" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><line x1="426" y1="104" x2="452" y2="104" stroke="#b3211b" stroke-width="2.2" marker-end="url(#a)"/><text x="388" y="124.0" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Fault; earthquakes</text><text x="388" y="132.784" font-size="7.2" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(San Andreas Fault)</text></svg>