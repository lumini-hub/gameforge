<svg viewBox="0 0 470 204" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><line x1="40" y1="190" x2="40" y2="12" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/><text x="8" y="110" font-size="8" text-anchor="middle" transform="rotate(-90 8 110)">Altitude</text><rect x="40" y="14" width="110" height="36" rx="0" fill="#e6f2fb" stroke="#2f6fb0" stroke-width="1.4"/><rect x="40" y="50" width="110" height="56" rx="0" fill="#dcecd0" stroke="#2a7a3a" stroke-width="1.4"/><rect x="40" y="106" width="110" height="84" rx="0" fill="#fbe3c0" stroke="#b36200" stroke-width="1.4"/><text x="95" y="36" font-size="8.4" text-anchor="middle" fill="#2f6fb0" font-weight="bold" font-style="normal">ALPINE</text><text x="95" y="82" font-size="8.4" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">TEMPERATE</text><text x="95" y="150" font-size="8.4" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">SUB-TROPICAL</text><line x1="36" y1="190" x2="40" y2="190" stroke="#333" stroke-width="1.2"/><text x="34" y="193" font-size="7" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">200 m</text><line x1="36" y1="106" x2="40" y2="106" stroke="#333" stroke-width="1.2"/><text x="34" y="109" font-size="7" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">2000 m</text><line x1="36" y1="50" x2="40" y2="50" stroke="#333" stroke-width="1.2"/><text x="34" y="53" font-size="7" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">4000 m</text><line x1="36" y1="14" x2="40" y2="14" stroke="#333" stroke-width="1.2"/><text x="34" y="17" font-size="7" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">7500 m</text><line x1="152" y1="22" x2="172" y2="22" stroke="#2f6fb0" stroke-width="1.4"/><text x="176" y="26" font-size="8.2" text-anchor="start" fill="#2f6fb0" font-weight="bold" font-style="normal">ALPINE (above ~4000 m)</text><text x="176" y="37" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">very cold, snow, short summer; meadows and shrubs;</text><text x="176" y="47" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">hardly inhabited; yak herders; cordyceps collection</text><line x1="152" y1="66" x2="172" y2="66" stroke="#2a7a3a" stroke-width="1.4"/><text x="176" y="70" font-size="8.2" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">TEMPERATE (~2000-4000 m)</text><text x="176" y="81" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">cool summer, cold dry winter; conifers, oak, rhododendron;</text><text x="176" y="91" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">Thimphu, Paro, Bumthang, Gasa; apples, potatoes, buckwheat</text><line x1="152" y1="136" x2="172" y2="136" stroke="#b36200" stroke-width="1.4"/><text x="176" y="140" font-size="8.2" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">SUB-TROPICAL (~200-2000 m)</text><text x="176" y="151" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">hot humid summer, mild winter, heavy monsoon rain;</text><text x="176" y="161" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">rice, maize, citrus; Phuentsholing, Gelephu, Samdrup Jongkhar</text><text x="300" y="196" font-size="7" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">Temperature falls about 6.5 C for every 1000 m you climb (lapse rate)</text></svg>