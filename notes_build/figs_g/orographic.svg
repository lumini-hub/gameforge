<svg viewBox="0 0 470 186" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><polygon points="20.0,150.0 150.0,150.0 220.0,44.0 300.0,150.0 450.0,150.0" fill="#d9b98a" stroke="#8a5a1c" stroke-width="1.6"/><line x1="14" y1="98" x2="80" y2="112" stroke="#2f6fb0" stroke-width="2.4" marker-end="url(#a)"/><text x="46" y="90" font-size="7.4" text-anchor="middle" fill="#2f6fb0" font-weight="bold" font-style="normal">moist monsoon wind</text><path d="M100,74 q8,-10 18,-4 q10,-8 18,2 q6,0 4,8 h-40 z" fill="#e8eef5" stroke="#889" stroke-width="1"/><path d="M130,62 q8,-10 18,-4 q10,-8 18,2 q6,0 4,8 h-40 z" fill="#e8eef5" stroke="#889" stroke-width="1"/><path d="M160,50 q8,-10 18,-4 q10,-8 18,2 q6,0 4,8 h-40 z" fill="#e8eef5" stroke="#889" stroke-width="1"/><text x="100" y="168" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">WINDWARD: heavy rain</text><text x="100" y="178" font-size="6.9" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">(southern foothills 5000+ mm)</text><text x="350" y="168" font-size="7.6" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">LEEWARD / RAIN SHADOW: dry</text><text x="350" y="178" font-size="6.9" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">(Paro, Thimphu, north: ~ 500-1000 mm)</text><text x="220" y="36" font-size="7.4" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Great Himalaya</text><line x1="300" y1="70" x2="350" y2="96" stroke="#666" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/><text x="380" y="66" font-size="7" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">dry, warm, sinking air</text><text x="235" y="14" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Mountains force air to rise, cool and drop rain on one side (orographic rainfall)</text></svg>