<svg viewBox="0 0 470 200" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235.0" y="13" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Timeline of the universe (bya = billion years ago)</text><line x1="14" y1="106.0" x2="456" y2="106.0" stroke="#0e3a66" stroke-width="3"/><circle cx="52.0" cy="106.0" r="5.5" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><line x1="52.0" y1="100.0" x2="52.0" y2="84.0" stroke="#999" stroke-width="1"/><text x="52.0" y="70.0" font-size="1" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal"></text><text x="52.0" y="49.400000000000006" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">13.8 bya</text><text x="52.0" y="60.400000000000006" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">BIG BANG: hot,</text><text x="52.0" y="69.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">dense point;</text><text x="52.0" y="77.60000000000001" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">space expands</text><circle cx="125.2" cy="106.0" r="5.5" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><line x1="125.2" y1="112.0" x2="125.2" y2="128.0" stroke="#999" stroke-width="1"/><text x="125.2" y="138.0" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">seconds-min</text><text x="125.2" y="148.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">matter forms;</text><text x="125.2" y="156.6" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">mostly hydrogen</text><text x="125.2" y="165.2" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">and helium</text><circle cx="198.4" cy="106.0" r="5.5" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><line x1="198.4" y1="100.0" x2="198.4" y2="84.0" stroke="#999" stroke-width="1"/><text x="198.4" y="70.0" font-size="1" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal"></text><text x="198.4" y="49.400000000000006" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">~400 000 yrs</text><text x="198.4" y="60.400000000000006" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">universe cools;</text><text x="198.4" y="69.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">light released</text><text x="198.4" y="77.60000000000001" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(background)</text><circle cx="271.6" cy="106.0" r="5.5" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><line x1="271.6" y1="112.0" x2="271.6" y2="128.0" stroke="#999" stroke-width="1"/><text x="271.6" y="138.0" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">~200 m yrs</text><text x="271.6" y="148.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">first stars and</text><text x="271.6" y="156.6" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">galaxies form</text><circle cx="344.8" cy="106.0" r="5.5" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.3"/><line x1="344.8" y1="100.0" x2="344.8" y2="84.0" stroke="#999" stroke-width="1"/><text x="344.8" y="70.0" font-size="1" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal"></text><text x="344.8" y="49.400000000000006" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">4.6 bya</text><text x="344.8" y="60.400000000000006" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">solar nebula:</text><text x="344.8" y="69.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Sun and planets</text><text x="344.8" y="77.60000000000001" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">form</text><circle cx="418.0" cy="106.0" r="5.5" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><line x1="418.0" y1="112.0" x2="418.0" y2="128.0" stroke="#999" stroke-width="1"/><text x="418.0" y="138.0" font-size="8.2" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">4.54 bya</text><text x="418.0" y="148.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Earth forms;</text><text x="418.0" y="156.6" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">oceans, then</text><text x="418.0" y="165.2" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">life later</text></svg>