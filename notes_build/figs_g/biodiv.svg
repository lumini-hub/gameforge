<svg viewBox="0 0 470 196" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><circle cx="120" cy="98" r="86" fill="#e2f2e2" stroke="#2a7a3a" stroke-width="1.8"/><circle cx="120" cy="114" r="58" fill="#fff7d6" stroke="#b36200" stroke-width="1.8"/><circle cx="120" cy="126" r="30" fill="#fde3e3" stroke="#b3211b" stroke-width="1.8"/><text x="120" y="34" font-size="8.2" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">ECOSYSTEM diversity</text><text x="120" y="74" font-size="8.2" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">SPECIES diversity</text><text x="120" y="126" font-size="7.6" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">GENETIC</text><text x="120" y="136" font-size="7.6" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">diversity</text><rect x="222" y="30" width="244" height="44" rx="3" fill="#fff" stroke="#b3211b" stroke-width="1.4"/><text x="230" y="43" font-size="8" text-anchor="start" fill="#b3211b" font-weight="bold" font-style="normal">Genetic diversity</text><text x="230" y="55" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">variety of genes within ONE species</text><text x="230" y="66" font-size="6.4" text-anchor="start" fill="#555" font-weight="normal" font-style="normal">e.g. many local rice, maize and potato varieties; different yak breeds</text><rect x="222" y="82" width="244" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.4"/><text x="230" y="95" font-size="8" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">Species diversity</text><text x="230" y="107" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">number/variety of species in an area</text><text x="230" y="118" font-size="6.4" text-anchor="start" fill="#555" font-weight="normal" font-style="normal">e.g. tiger, takin, red panda, black-necked crane, 5,500+ plant species</text><rect x="222" y="134" width="244" height="44" rx="3" fill="#fff" stroke="#2a7a3a" stroke-width="1.4"/><text x="230" y="147" font-size="8" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">Ecosystem diversity</text><text x="230" y="159" font-size="6.9" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">variety of habitats and ecosystems</text><text x="230" y="170" font-size="6.4" text-anchor="start" fill="#555" font-weight="normal" font-style="normal">e.g. subtropical forest, temperate forest, alpine meadow, wetlands</text></svg>