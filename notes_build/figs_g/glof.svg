<svg viewBox="0 0 470 122" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="0.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="18" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">1. Global warming</text><text x="70.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">temperature rises;</text><text x="70.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">glaciers melt and</text><text x="70.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">retreat quickly</text><line x1="140.0" y1="28.0" x2="164.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="18" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">2. Glacial lake</text><text x="235.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">meltwater collects</text><text x="235.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">behind a moraine</text><text x="235.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">(loose rock) dam</text><line x1="305.0" y1="28.0" x2="329.0" y2="28.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="6" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="18" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">3. Lake grows</text><text x="400.0" y="29.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">water volume and</text><text x="400.0" y="37.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">pressure on the</text><text x="400.0" y="45.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">weak dam increase</text><path d="M400.0,50 L400.0,61.0 L70.0,61.0 L70.0,71" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="0.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.6"/><text x="70.0" y="84" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">4. Trigger</text><text x="70.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">earthquake, avalanche,</text><text x="70.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">landslide or heavy</text><text x="70.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">rain breaks the dam</text><line x1="140.0" y1="94.0" x2="164.0" y2="94.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="165.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#0f7b6c" stroke-width="1.6"/><text x="235.0" y="84" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">5. GLOF</text><text x="235.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">sudden huge flood</text><text x="235.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">down the valley:</text><text x="235.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Punakha, 1994</text><line x1="305.0" y1="94.0" x2="329.0" y2="94.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><rect x="330.0" y="72" width="140" height="44" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.6"/><text x="400.0" y="84" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">6. Damage</text><text x="400.0" y="95.0" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">lives, homes, farms,</text><text x="400.0" y="103.4" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">bridges, roads, power;</text><text x="400.0" y="111.8" font-size="6.9" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">soil erosion</text></svg>