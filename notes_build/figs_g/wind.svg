<svg viewBox="0 0 470 190" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><line x1="20" y1="150" x2="450" y2="150" stroke="#8a5a1c" stroke-width="5"/><line x1="20" y1="120" x2="450" y2="120" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4 3"/><text x="448" y="116" font-size="7" text-anchor="end" fill="#666" font-weight="normal" font-style="normal">1.5 m</text><circle cx="70" cy="40" r="2.2" fill="#999" stroke="#777" stroke-width="1.3"/><line x1="74" y1="40" x2="92" y2="40" stroke="#0f7b6c" stroke-width="1.2" marker-end="url(#a)"/><circle cx="110" cy="55" r="2.2" fill="#999" stroke="#777" stroke-width="1.3"/><line x1="114" y1="55" x2="132" y2="55" stroke="#0f7b6c" stroke-width="1.2" marker-end="url(#a)"/><circle cx="150" cy="36" r="2.2" fill="#999" stroke="#777" stroke-width="1.3"/><line x1="154" y1="36" x2="172" y2="36" stroke="#0f7b6c" stroke-width="1.2" marker-end="url(#a)"/><circle cx="190" cy="50" r="2.2" fill="#999" stroke="#777" stroke-width="1.3"/><line x1="194" y1="50" x2="212" y2="50" stroke="#0f7b6c" stroke-width="1.2" marker-end="url(#a)"/><text x="130" y="22" font-size="8" text-anchor="middle" fill="#0f7b6c" font-weight="bold" font-style="normal">SUSPENSION: fine dust carried high in the air</text><path d="M230,148 Q262,80 292,148" fill="none" stroke="#b36200" stroke-width="1.6" stroke-dasharray="4 2"/><circle cx="230" cy="147" r="3" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><path d="M300,148 Q332,80 362,148" fill="none" stroke="#b36200" stroke-width="1.6" stroke-dasharray="4 2"/><circle cx="300" cy="147" r="3" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><path d="M370,148 Q402,80 432,148" fill="none" stroke="#b36200" stroke-width="1.6" stroke-dasharray="4 2"/><circle cx="370" cy="147" r="3" fill="#b36200" stroke="#b36200" stroke-width="1.3"/><text x="330" y="70" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">SALTATION: sand grains bounce</text><text x="330" y="82" font-size="7.4" text-anchor="middle" fill="#b36200" font-weight="normal" font-style="normal">(up to about 1.5 m high)</text><circle cx="60" cy="143" r="6" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><line x1="68" y1="143" x2="82" y2="143" stroke="#b3211b" stroke-width="1.6" marker-end="url(#a)"/><circle cx="100" cy="143" r="6" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><line x1="108" y1="143" x2="122" y2="143" stroke="#b3211b" stroke-width="1.6" marker-end="url(#a)"/><circle cx="140" cy="143" r="6" fill="#c9a27a" stroke="#8a5a1c" stroke-width="1.3"/><line x1="148" y1="143" x2="162" y2="143" stroke="#b3211b" stroke-width="1.6" marker-end="url(#a)"/><text x="14" y="172" font-size="7.8" text-anchor="start" fill="#b3211b" font-weight="bold" font-style="normal">SURFACE CREEP: heavy grains pushed / rolled</text><text x="360" y="172" font-size="7.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">EROSION by wind: deflation (lifting) and abrasion</text><text x="360" y="183" font-size="7.2" text-anchor="middle" fill="#0e3a66" font-weight="normal" font-style="normal">(sand blasting a rock surface)</text></svg>