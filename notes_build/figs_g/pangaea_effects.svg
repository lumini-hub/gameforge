<svg viewBox="0 0 470 114" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><rect x="8" y="8" width="224" height="98" rx="4" fill="#fff" stroke="#b36200" stroke-width="1.5"/><text x="120" y="22" font-size="8" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">If all continents joined again (consequences)</text><text x="14" y="36.0" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">1 Vast dry interior far from the sea: huge</text><text x="14" y="46.6" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">  deserts, extreme hot/cold (continental climate)</text><text x="14" y="57.2" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">2 One giant ocean, shorter coastline: less</text><text x="14" y="67.8" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">  coastal rainfall, fewer marine habitats</text><text x="14" y="78.4" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">3 Species mix; competition; extinction of some</text><text x="14" y="89.0" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">4 Old mountains erode, new ones where plates collide</text><rect x="240" y="8" width="222" height="98" rx="4" fill="#fff" stroke="#0e3a66" stroke-width="1.5"/><text x="351" y="22" font-size="8" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Evidence for continental drift (Wegener)</text><text x="246" y="36.0" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">1 Jigsaw fit: S. America / Africa coasts</text><text x="246" y="47.4" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">2 Same fossils (Mesosaurus, Glossopteris)</text><text x="246" y="58.8" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">3 Matching rock strata and coalfields</text><text x="246" y="70.2" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">4 Glacial deposits in now-warm lands</text><text x="246" y="81.6" font-size="6.9" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">5 Later: sea-floor spreading, GPS plate movement</text></svg>