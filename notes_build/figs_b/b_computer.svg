<svg viewBox="0 0 470 200" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">The nervous system works like a computer</text><text x="10" y="34" font-size="8.0" text-anchor="start" fill="#555" font-weight="bold" font-style="normal">COMPUTER</text><text x="10" y="118" font-size="8.0" text-anchor="start" fill="#555" font-weight="bold" font-style="normal">HUMAN BODY</text><rect x="10" y="40" width="130" height="50" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="75" y="55" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">INPUT</text><text x="75" y="67.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">keyboard, mouse,</text><text x="75" y="75.5" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">sensors</text><rect x="10" y="124" width="130" height="50" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="75" y="139" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">RECEPTORS</text><text x="75" y="151.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">eye, ear, skin, nose,</text><text x="75" y="159.5" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">tongue (+ sensory neurons)</text><line x1="75" y1="90" x2="75" y2="124" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="170" y="40" width="130" height="50" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="235" y="55" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">CPU</text><text x="235" y="67.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">processing</text><rect x="170" y="124" width="130" height="50" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="235" y="139" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">BRAIN + SPINAL CORD</text><text x="235" y="151.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">processing (CNS)</text><line x1="235" y1="90" x2="235" y2="124" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="330" y="40" width="130" height="50" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="395" y="55" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">OUTPUT</text><text x="395" y="67.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">monitor, speaker</text><rect x="330" y="124" width="130" height="50" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="395" y="139" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">EFFECTORS</text><text x="395" y="151.0" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">muscles, glands</text><text x="395" y="159.5" font-size="7.42" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">(via motor neurons)</text><line x1="395" y1="90" x2="395" y2="124" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/><line x1="141" y1="65" x2="169" y2="65" stroke="#1f5fa8" stroke-width="1.8" marker-end="url(#a)"/><line x1="301" y1="65" x2="329" y2="65" stroke="#1f5fa8" stroke-width="1.8" marker-end="url(#a)"/><line x1="141" y1="149" x2="169" y2="149" stroke="#2a7a3a" stroke-width="1.8" marker-end="url(#a)"/><line x1="301" y1="149" x2="329" y2="149" stroke="#2a7a3a" stroke-width="1.8" marker-end="url(#a)"/><rect x="170" y="94" width="130" height="22" rx="4" fill="#fff4e0" stroke="#a05a00" stroke-width="1.2"/><text x="235" y="108" font-size="7.89" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">Hard disk = memory in the brain</text><text x="235" y="192" font-size="7.89" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Both use electrical signals.  A computer cannot make its own decisions; it follows a program.</text></svg>