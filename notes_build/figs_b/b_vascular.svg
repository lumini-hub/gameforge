<svg viewBox="0 0 470 212" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Conducting (vascular) tissue</text><rect x="175" y="20" width="120" height="24" rx="3" fill="#fff" stroke="#0e3a66" stroke-width="1.5"/><text x="235.0" y="35.0" font-size="8.6" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">CONDUCTING TISSUE</text><rect x="30" y="66" width="190" height="26" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.5"/><text x="125.0" y="82.0" font-size="8.6" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">XYLEM: water + minerals (up only)</text><rect x="250" y="66" width="190" height="26" rx="3" fill="#fff4e0" stroke="#b36200" stroke-width="1.5"/><text x="345.0" y="82.0" font-size="8.6" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">① PHLOEM: food (up and down)</text><line x1="235" y1="44" x2="235" y2="54" stroke="#333" stroke-width="1.4"/><line x1="125" y1="54" x2="345" y2="54" stroke="#333" stroke-width="1.4"/><line x1="125" y1="54" x2="125" y2="66" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/><line x1="345" y1="54" x2="345" y2="66" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/><line x1="125" y1="92" x2="125" y2="100" stroke="#333" stroke-width="1.1"/><line x1="345" y1="92" x2="345" y2="100" stroke="#333" stroke-width="1.1"/><line x1="33" y1="100" x2="204" y2="100" stroke="#333" stroke-width="1.1"/><line x1="269" y1="100" x2="440" y2="100" stroke="#333" stroke-width="1.1"/><line x1="33" y1="100" x2="33" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><line x1="269" y1="100" x2="269" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><rect x="6" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.2"/><text x="33" y="126.0" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Xylem</text><text x="33" y="133.808" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">vessel</text><text x="33" y="150.0" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">main water</text><text x="33" y="156.832" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">pipe (dead)</text><rect x="242" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.2"/><text x="269" y="126.0" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">② Sieve tube</text><text x="269" y="133.808" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">element</text><text x="269" y="150.0" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">conducts food</text><text x="269" y="156.588" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">(like oesophagus)</text><line x1="90" y1="100" x2="90" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><line x1="326" y1="100" x2="326" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><rect x="63" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.2"/><text x="90" y="126.0" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">③ Tracheid</text><text x="90" y="150.0" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">water pipe</text><text x="90" y="156.832" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">(dead)</text><rect x="299" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.2"/><text x="326" y="126.0" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">Companion</text><text x="326" y="133.808" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">cell</text><text x="326" y="150.0" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">controls sieve</text><text x="326" y="156.588" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">tube, gives ATP</text><line x1="147" y1="100" x2="147" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><line x1="383" y1="100" x2="383" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><rect x="120" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.2"/><text x="147" y="126.0" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Xylem</text><text x="147" y="133.808" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">fibre</text><text x="147" y="150.0" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">support</text><rect x="356" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.2"/><text x="383" y="126.0" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">④ Phloem</text><text x="383" y="133.808" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">fibre</text><text x="383" y="150.0" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">support</text><line x1="204" y1="100" x2="204" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><line x1="440" y1="100" x2="440" y2="112" stroke="#333" stroke-width="1.1" marker-end="url(#a)"/><rect x="177" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.2"/><text x="204" y="126.0" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">⑤ Xylem</text><text x="204" y="133.808" font-size="7.42" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">parenchyma</text><text x="204" y="150.0" font-size="6.5" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">storage</text><rect x="413" y="112" width="54" height="60" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.2"/><text x="440" y="126.0" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">⑥ Phloem</text><text x="440" y="133.808" font-size="7.42" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">parenchyma</text><text x="440" y="150.0" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">stores food,</text><text x="440" y="156.588" font-size="6.26" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">conducts</text><text x="235" y="190.0" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Numbers ①–⑥ are the blanks of P24 Q7b: 1 phloem, 2 sieve element, 3 tracheid, 4 phloem</text><text x="235" y="197.564" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">fibre, 5 xylem parenchyma, 6 phloem parenchyma</text></svg>