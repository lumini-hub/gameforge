 ry="3.4" fill="#7fcf7f" stroke="#2a7a3a" stroke-width="1"/><ellipse cx="160" cy="116" rx="20" ry="3.4" fill="#7fcf7f" stroke="#2a7a3a" stroke-width="1"/><circle cx="335" cy="122" r="34" fill="#fff" stroke="#1f5fa8" stroke-width="1.6"/><path d="M335,88 C361,88 369,122 345,142" fill="none" stroke="#1f5fa8" stroke-width="2"/><path d="M335,156 C307,156 299,122 325,102" fill="none" stroke="#1f5fa8" stroke-width="2"/><path d="M345,142 l-3,-8 l9,3 z" fill="#1f5fa8"/><path d="M325,102 l3,8 l-9,-3 z" fill="#1f5fa8"/><text x="335" y="118.0" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Calvin</text><text x="335" y="127.76" font-size="8.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">cycle</text><circle cx="40" cy="40" r="11" fill="#ffd54a" stroke="#b36200" stroke-width="1.4"/><line x1="54.0" y1="40.0" x2="59.0" y2="40.0" stroke="#b36200" stroke-width="1.4"/><line x1="49.89949493661167" y1="49.89949493661166" x2="53.435028842544405" y2="53.4350288425444" stroke="#b36200" stroke-width="1.4"/><line x1="40.0" y1="54.0" x2="40.0" y2="59.0" stroke="#b36200" stroke-width="1.4"/><line x1="30.100505063388336" y1="49.89949493661167" x2="26.5649711574556" y2="53.435028842544405" stroke="#b36200" stroke-width="1.4"/><line x1="26.0" y1="40.0" x2="21.0" y2="40.0" stroke="#b36200" stroke-width="1.4"/><line x1="30.100505063388333" y1="30.100505063388336" x2="26.564971157455595" y2="26.5649711574556" stroke="#b36200" stroke-width="1.4"/><line x1="40.0" y1="26.0" x2="40.0" y2="21.0" stroke="#b36200" stroke-width="1.4"/><line x1="49.89949493661166" y1="30.100505063388333" x2="53.4350288425444" y2="26.564971157455595" stroke="#b36200" stroke-width="1.4"/><line x1="55" y1="52" x2="92" y2="96" stroke="#d9a200" stroke-width="2.4" marker-end="url(#a)"/><text x="36" y="66" font-size="8.58" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">light</text><line x1="150" y1="30" x2="150" y2="86" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a)"/><text x="150" y="26" font-size="9.05" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">H₂O (water)</text><line x1="190" y1="118" x2="190" y2="196" stroke="#c33" stroke-width="2" marker-end="url(#a)"/><text x="198" y="204" font-size="9.05" text-anchor="start" fill="#c33" font-weight="bold" font-style="normal">O₂ released</text><line x1="335" y1="30" x2="335" y2="86" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="335" y="26" font-size="9.05" text-anchor="middle" fill="#333" font-weight="bold" font-style="normal">CO₂ (carbon dioxide)</text><line x1="335" y1="156" x2="335" y2="196" stroke="#2a7a3a" stroke-width="2" marker-end="url(#a)"/><text x="346" y="205" font-size="8.0" text-anchor="start" fill="#2a7a3a" font-weight="bold" font-style="normal">GLUCOSE</text><line x1="190" y1="96" x2="296" y2="108" stroke="#a05a00" stroke-width="1.8" marker-end="url(#a)"/><text x="244" y="94" font-size="9.05" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">ATP</text><line x1="190" y1="108" x2="296" y2="120" stroke="#7a3b9b" stroke-width="1.8" marker-end="url(#a)"/><text x="244" y="121" font-size="9.05" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">NADPH</text><line x1="296" y1="136" x2="190" y2="128" stroke="#888" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/><text x="244" y="146" font-size="7.66" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">ADP, NADP⁺ return</text><text x="100" y="218" font-size="8.82" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">GRANA (thylakoids) = LIGHT REACTION</text><text x="335" y="218" font-size="8.82" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">STROMA = DARK REACTION</text><text x="100" y="228" font-size="7.42" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">needs light + water; makes ATP, NADPH, O₂</text><text x="335" y="228" font-size="7.42" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">needs CO₂ + ATP + NADPH; makes glucose</text></svg>