<svg viewBox="0 0 470 204" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Biodiversity and the health of the ecosystem</text><rect x="6" y="18" width="226" height="178" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="119.0" y="29" font-size="8.4" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">GOOD: a positive cycle</text><rect x="238" y="18" width="226" height="178" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="351.0" y="29" font-size="8.4" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">BAD: a negative cycle</text><rect x="29" y="42" width="180" height="34" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="119" y="56" font-size="8.35" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">HIGH BIODIVERSITY</text><text x="119" y="68" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">many genes, species, habitats</text><rect x="29" y="88" width="180" height="34" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="119" y="102" font-size="8.35" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">STABLE, HEALTHY ECOSYSTEM</text><text x="119" y="114" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">resilient; resists invasive species</text><rect x="29" y="134" width="180" height="34" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="119" y="148" font-size="8.35" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">ECOSYSTEM SERVICES</text><text x="119" y="160" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">food, clean water, pollination, soil</text><line x1="119" y1="74" x2="119" y2="86" stroke="#2a7a3a" stroke-width="1.8" marker-end="url(#a)"/><line x1="119" y1="122" x2="119" y2="132" stroke="#2a7a3a" stroke-width="1.8" marker-end="url(#a)"/><path d="M209,150 C226,150 226,58 209,58" fill="none" stroke="#2a7a3a" stroke-width="1.8"/><path d="M209,58 l8,-3 l0,6 z" fill="#2a7a3a"/><text x="119" y="184" font-size="6.96" text-anchor="middle" fill="#2a7a3a" font-weight="normal" font-style="normal">services support people and species, so we protect biodiversity</text><rect x="261" y="42" width="180" height="34" rx="5" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.4"/><text x="351" y="56" font-size="8.35" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">THREATS</text><text x="351" y="68" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">habitat loss, poaching, pollution</text><rect x="261" y="88" width="180" height="34" rx="5" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.4"/><text x="351" y="102" font-size="8.35" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">LOSS OF SPECIES</text><text x="351" y="114" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">food webs break, fewer pollinators</text><rect x="261" y="134" width="180" height="34" rx="5" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.4"/><text x="351" y="148" font-size="8.35" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">UNSTABLE ECOSYSTEM</text><text x="351" y="160" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">invasive species, disease, collapse</text><line x1="351" y1="74" x2="351" y2="86" stroke="#b3211b" stroke-width="1.8" marker-end="url(#a)"/><line x1="351" y1="122" x2="351" y2="132" stroke="#b3211b" stroke-width="1.8" marker-end="url(#a)"/><text x="351" y="184" font-size="6.96" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">poaching is NOT a healthy sign (P24 Q1a(xi))</text></svg>