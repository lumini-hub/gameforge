<svg viewBox="0 0 470 222" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">How urine is formed</text><rect x="8" y="24" width="142" height="44" rx="4" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.5"/><text x="79" y="39" font-size="8.82" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">BLOOD in glomerulus</text><text x="79" y="51.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">high pressure</text><rect x="164" y="24" width="142" height="44" rx="4" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.5"/><text x="235" y="39" font-size="8.82" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">1 FILTRATION</text><text x="235" y="51.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">water, glucose, urea, salts → capsule</text><rect x="320" y="24" width="142" height="44" rx="4" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/><text x="391" y="39" font-size="8.82" text-anchor="middle" fill="#555" font-weight="bold" font-style="normal">PRIMARY URINE</text><text x="391" y="51.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">glomerular filtrate</text><rect x="320" y="84" width="142" height="44" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.5"/><text x="391" y="99" font-size="8.82" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">2 REABSORPTION</text><text x="391" y="111.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">PCT: glucose, amino acids, Na⁺, water</text><rect x="164" y="84" width="142" height="44" rx="4" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.5"/><text x="235" y="99" font-size="8.82" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">LOOP OF HENLE</text><text x="235" y="111.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">water + salt reabsorbed</text><rect x="8" y="84" width="142" height="44" rx="4" fill="#fff4e0" stroke="#a05a00" stroke-width="1.5"/><text x="79" y="99" font-size="8.82" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">3 DCT</text><text x="79" y="111.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">Na⁺ (aldosterone), water (ADH) in;</text><line x1="150" y1="46" x2="162" y2="46" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="306" y1="46" x2="318" y2="46" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="391" y1="70" x2="391" y2="82" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="318" y1="106" x2="308" y2="106" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="162" y1="106" x2="152" y2="106" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="8" y="140" width="142" height="44" rx="4" fill="#fff4e0" stroke="#a05a00" stroke-width="1.5"/><text x="79" y="155.0" font-size="7.42" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">secretion into tubule:</text><text x="79" y="164.5" font-size="7.42" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">urea, uric acid, creatinine, K⁺</text><rect x="164" y="140" width="142" height="44" rx="4" fill="#fffbe0" stroke="#b3a000" stroke-width="1.5"/><text x="235" y="155.0" font-size="7.42" text-anchor="middle" fill="#7a6a00" font-weight="bold" font-style="normal">COLLECTING DUCT</text><text x="235" y="164.5" font-size="7.42" text-anchor="middle" fill="#7a6a00" font-weight="bold" font-style="normal">ADH: more water back to blood</text><rect x="320" y="140" width="142" height="44" rx="4" fill="#fff3b0" stroke="#b3a000" stroke-width="1.8"/><text x="391" y="158" font-size="8.12" text-anchor="middle" fill="#7a6a00" font-weight="bold" font-style="normal">URINE</text><text x="391" y="168" font-size="8.12" text-anchor="middle" fill="#7a6a00" font-weight="bold" font-style="normal">ureter → bladder → urethra</text><line x1="79" y1="128" x2="79" y2="138" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="150" y1="162" x2="162" y2="162" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="306" y1="162" x2="318" y2="162" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><line x1="79" y1="128" x2="79" y2="116" stroke="#333" stroke-width="1.5"/><text x="235" y="200.0" font-size="7.66" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">Little water in the body → more ADH → more water reabsorbed → small volume of</text><text x="235" y="208.052" font-size="7.66" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">concentrated urine (P23 Q5a)</text></svg>