<svg viewBox="0 0 470 210" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Digestion: which enzyme, where, end product</text><rect x="4" y="38" width="462" height="46" rx="4" fill="#fbfcfe" stroke="#b36200" stroke-width="1.2"/><text x="12" y="50" font-size="8.0" text-anchor="start" fill="#b36200" font-weight="bold" font-style="normal">CARBOHYDRATE</text><rect x="14" y="58" width="60" height="20" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.5"/><text x="44.0" y="71.0" font-size="8.6" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">Starch</text><line x1="76" y1="68" x2="130" y2="68" stroke="#b36200" stroke-width="1.8" marker-end="url(#a)"/><text x="103" y="62" font-size="6.73" text-anchor="middle" fill="#b36200" font-weight="normal" font-style="normal">salivary amylase</text><rect x="132" y="58" width="60" height="20" rx="3" fill="#fff" stroke="#b36200" stroke-width="1.5"/><text x="162.0" y="71.0" font-size="8.6" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">Maltose</text><line x1="194" y1="68" x2="330" y2="68" stroke="#b36200" stroke-width="1.8" marker-end="url(#a)"/><text x="262" y="62" font-size="6.73" text-anchor="middle" fill="#b36200" font-weight="normal" font-style="normal">maltase (in small intestine)</text><rect x="332" y="58" width="80" height="20" rx="3" fill="#fff4e0" stroke="#b36200" stroke-width="1.5"/><text x="372.0" y="71.0" font-size="8.6" text-anchor="middle" fill="#b36200" font-weight="bold" font-style="normal">GLUCOSE</text><rect x="4" y="90" width="462" height="46" rx="4" fill="#fbfcfe" stroke="#1f5fa8" stroke-width="1.2"/><text x="12" y="102" font-size="8.0" text-anchor="start" fill="#1f5fa8" font-weight="bold" font-style="normal">PROTEIN</text><rect x="14" y="110" width="60" height="20" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.5"/><text x="44.0" y="123.0" font-size="8.6" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Protein</text><line x1="76" y1="120" x2="190" y2="120" stroke="#1f5fa8" stroke-width="1.8" marker-end="url(#a)"/><text x="133" y="114" font-size="6.73" text-anchor="middle" fill="#1f5fa8" font-weight="normal" font-style="normal">pepsin + HCl (stomach)</text><rect x="192" y="110" width="60" height="20" rx="3" fill="#fff" stroke="#1f5fa8" stroke-width="1.5"/><text x="222.0" y="123.0" font-size="8.6" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Peptides</text><line x1="254" y1="120" x2="330" y2="120" stroke="#1f5fa8" stroke-width="1.8" marker-end="url(#a)"/><text x="292" y="114" font-size="6.73" text-anchor="middle" fill="#1f5fa8" font-weight="normal" font-style="normal">trypsin, peptidases</text><rect x="332" y="110" width="100" height="20" rx="3" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.5"/><text x="382.0" y="123.0" font-size="8.6" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">AMINO ACIDS</text><rect x="4" y="142" width="462" height="46" rx="4" fill="#fbfcfe" stroke="#a02a2a" stroke-width="1.2"/><text x="12" y="154" font-size="8.0" text-anchor="start" fill="#a02a2a" font-weight="bold" font-style="normal">FAT</text><rect x="14" y="162" width="60" height="20" rx="3" fill="#fff" stroke="#a02a2a" stroke-width="1.5"/><text x="44.0" y="175.0" font-size="8.6" text-anchor="middle" fill="#a02a2a" font-weight="bold" font-style="normal">Fat</text><line x1="76" y1="172" x2="330" y2="172" stroke="#a02a2a" stroke-width="1.8" marker-end="url(#a)"/><text x="203" y="166" font-size="6.73" text-anchor="middle" fill="#a02a2a" font-weight="normal" font-style="normal">bile (liver) emulsifies  →  pancreatic lipase</text><rect x="332" y="162" width="128" height="20" rx="3" fill="#fdeaea" stroke="#a02a2a" stroke-width="1.5"/><text x="396.0" y="175.0" font-size="8.12" text-anchor="middle" fill="#a02a2a" font-weight="bold" font-style="normal">FATTY ACIDS + GLYCEROL</text><text x="235" y="202" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Absorption of the end products happens through the villi of the small intestine; water is absorbed in the large intestine.</text></svg>