<svg viewBox="0 0 470 192" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Factors limiting the rate of photosynthesis</text><rect x="8" y="18" width="148" height="168" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="82.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Light intensity</text><line x1="26" y1="150" x2="26" y2="50" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><line x1="26" y1="150" x2="144" y2="150" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><path transform="translate(26,150)" d="M0,0 C20,-48 60,-70 118,-76" fill="none" stroke="#2a7a3a" stroke-width="2.2"/><text x="16" y="100" font-size="7.66" text-anchor="middle" transform="rotate(-90 16 100)">Rate of photosynthesis</text><text x="86" y="161" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Light intensity →</text><text x="82" y="40.0" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">levels off: another factor</text><text x="82" y="47.808" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">(CO₂ / temperature) is limiting</text><line x1="96" y1="76" x2="144" y2="74" stroke="#b3211b" stroke-width="1" stroke-dasharray="3 2"/><rect x="162" y="18" width="148" height="168" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="236.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">CO₂ concentration</text><line x1="180" y1="150" x2="180" y2="50" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><line x1="180" y1="150" x2="298" y2="150" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><path transform="translate(180,150)" d="M0,0 C20,-48 60,-70 118,-76" fill="none" stroke="#2a7a3a" stroke-width="2.2"/><text x="170" y="100" font-size="7.66" text-anchor="middle" transform="rotate(-90 170 100)">Rate of photosynthesis</text><text x="240" y="161" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">CO₂ concentration →</text><text x="236" y="40.0" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">levels off: light or</text><text x="236" y="47.808" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">temperature is limiting</text><line x1="250" y1="76" x2="298" y2="74" stroke="#b3211b" stroke-width="1" stroke-dasharray="3 2"/><rect x="316" y="18" width="148" height="168" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="390.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Temperature</text><line x1="334" y1="150" x2="334" y2="50" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><line x1="334" y1="150" x2="452" y2="150" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><path transform="translate(334,150)" d="M0,0 C40,-20 70,-50 80,-78 C90,-90 96,-60 104,0" fill="none" stroke="#2a7a3a" stroke-width="2.2"/><text x="324" y="100" font-size="7.66" text-anchor="middle" transform="rotate(-90 324 100)">Rate of photosynthesis</text><text x="394" y="161" font-size="7.89" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Temperature (°C) →</text><text x="390" y="40.0" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">optimum about 35–40 °C</text><text x="390" y="47.808" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">above it enzymes denature</text><line x1="414" y1="150" x2="414" y2="72" stroke="#b3211b" stroke-width="1" stroke-dasharray="3 2"/><text x="414" y="68" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">optimum</text></svg>