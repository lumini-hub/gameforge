66" text-anchor="start" fill="#1a6a2a" font-weight="bold" font-style="normal">Water plants / algae (biotic)</text><line x1="298" y1="25.2" x2="290" y2="114" stroke="#666" stroke-width="0.8"/><text x="300" y="28" font-size="7.66" text-anchor="start" fill="#1a6a2a" font-weight="bold" font-style="normal">Fish (biotic)</text><line x1="375" y1="52" x2="380" y2="70" stroke="#666" stroke-width="0.8"/><text x="375" y="50" font-size="7.66" text-anchor="middle" fill="#1a6a2a" font-weight="bold" font-style="normal">Frog (biotic)</text><line x1="412" y1="155.4" x2="418" y2="134" stroke="#666" stroke-width="0.8"/><text x="412" y="162" font-size="7.66" text-anchor="middle" fill="#1a6a2a" font-weight="bold" font-style="normal">Bacteria (biotic)</text><line x1="18" y1="163.2" x2="40" y2="142" stroke="#666" stroke-width="0.8"/><text x="20" y="166" font-size="7.66" text-anchor="start" fill="#a05a00" font-weight="bold" font-style="normal">Mud / soil (abiotic)</text><line x1="240" y1="54" x2="240" y2="84" stroke="#666" stroke-width="0.8"/><text x="240" y="52" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">Water, dissolved O₂ and CO₂, temperature (abiotic)</text><text x="235" y="186" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Plants need sunlight, water and CO₂; fish and frogs need dissolved oxygen and water;</text><text x="235" y="196" font-size="7.66" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">bacteria need mud and warmth: every biotic component depends on the abiotic ones (P23 Q9d).</text></svg>