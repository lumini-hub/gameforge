<svg viewBox="0 0 470 246" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Who can give blood to whom (ABO system)</text><line x1="84.59292834006217" y1="109.90311238679853" x2="210.5243276315993" y2="64.77162824763494" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/><line x1="84.59292834006217" y1="126.09688761320147" x2="210.5243276315993" y2="171.22837175236506" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/><line x1="86.0" y1="118.0" x2="382.0" y2="118.0" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/><line x1="257.5929283400622" y1="64.09688761320147" x2="383.5243276315993" y2="109.22837175236506" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/><line x1="257.5929283400622" y1="171.9031123867985" x2="383.5243276315993" y2="126.77162824763494" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/><path d="M41,109 C16,96 16,140 41,127" fill="none" stroke="#333" stroke-width="1.5"/><path d="M41,127 l7,-1 l-3,-7 z" fill="#333"/><path d="M226,35 C213,12 257,12 244,35" fill="none" stroke="#333" stroke-width="1.5"/><path d="M244,35 l-2,-7 l8,3 z" fill="#333"/><path d="M226,201 C213,224 257,224 244,201" fill="none" stroke="#333" stroke-width="1.5"/><path d="M244,201 l-2,7 l8,-3 z" fill="#333"/><path d="M429,109 C454,96 454,140 429,127" fill="none" stroke="#333" stroke-width="1.5"/><path d="M429,127 l-7,-1 l3,-7 z" fill="#333"/><circle cx="62" cy="118" r="22" fill="#ffd6d6" stroke="#555" stroke-width="1.6"/><text x="62" y="123" font-size="14.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">O</text><circle cx="235" cy="56" r="22" fill="#ffe9b8" stroke="#555" stroke-width="1.6"/><text x="235" y="61" font-size="14.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">A</text><circle cx="235" cy="180" r="22" fill="#d6e8ff" stroke="#555" stroke-width="1.6"/><text x="235" y="185" font-size="14.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">B</text><circle cx="408" cy="118" r="22" fill="#e6d6ff" stroke="#555" stroke-width="1.6"/><text x="408" y="123" font-size="14.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">AB</text><rect x="4" y="24" width="126" height="42" rx="4" fill="#fff" stroke="#b3211b" stroke-width="1.2"/><text x="67" y="38" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">X = O: universal donor</text><text x="67" y="47" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">no A or B antigen on RBC</text><text x="67" y="56" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">has anti-A and anti-B</text><rect x="334" y="24" width="132" height="42" rx="4" fill="#fff" stroke="#5b3a8a" stroke-width="1.2"/><text x="400" y="38" font-size="7.42" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">Y = AB: universal recipient</text><text x="400" y="47" font-size="7.42" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">no antibodies in plasma</text><text x="400" y="56" font-size="7.42" text-anchor="middle" fill="#5b3a8a" font-weight="bold" font-style="normal">has A and B antigens</text><text x="262" y="60" font-size="7.42" text-anchor="start" fill="#555" font-weight="normal" font-style="normal">antigen A, anti-B</text><text x="262" y="184" font-size="7.42" text-anchor="start" fill="#555" font-weight="normal" font-style="normal">antigen B, anti-A</text><text x="235" y="226.0" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">Arrow = can donate to; loop = can donate to its own group.  Rh− donors are safe for Rh−</text><text x="235" y="233.564" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">and Rh+; Rh+ blood must only go to Rh+.</text></svg>