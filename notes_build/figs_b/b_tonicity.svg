<svg viewBox="0 0 470 224" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Effect of the outside solution on animal and plant cells</text><rect x="8" y="18" width="148" height="200" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="82.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Hypotonic</text><text x="82" y="39" font-size="7.42" text-anchor="middle" fill="#444" font-weight="normal" font-style="italic">(more dilute outside)</text><circle cx="82" cy="70" r="26" fill="#ffe3e0" stroke="#9b3b2a" stroke-width="1.8"/><circle cx="82" cy="70" r="8" fill="#d9ecff" stroke="#1f5fa8" stroke-width="1"/><text x="82" y="108" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">swells, may burst (lysis)</text><text x="28" y="50" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Animal</text><text x="28" y="130" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Plant</text><rect x="54" y="138" width="56" height="42" rx="5" fill="#fff" stroke="#2a7a3a" stroke-width="2.4"/><rect x="56" y="140" width="52" height="38" rx="4" fill="#c9efc9" stroke="#2a7a3a" stroke-width="1"/><text x="82" y="200" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="normal" font-style="normal">turgid (firm)</text><text x="82" y="213" font-size="7.66" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">water IN</text><rect x="162" y="18" width="148" height="200" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="236.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Isotonic</text><text x="236" y="39" font-size="7.42" text-anchor="middle" fill="#444" font-weight="normal" font-style="italic">(same concentration)</text><circle cx="236" cy="70" r="20" fill="#ffe3e0" stroke="#9b3b2a" stroke-width="1.8"/><circle cx="236" cy="70" r="6" fill="#d9ecff" stroke="#1f5fa8" stroke-width="1"/><text x="236" y="108" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="normal" font-style="normal">normal</text><text x="182" y="50" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Animal</text><text x="182" y="130" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Plant</text><rect x="208" y="138" width="56" height="42" rx="5" fill="#fff" stroke="#2a7a3a" stroke-width="2.4"/><rect x="213" y="143" width="46" height="32" rx="4" fill="#c9efc9" stroke="#2a7a3a" stroke-width="1"/><text x="236" y="200" font-size="7.89" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">flaccid / normal</text><text x="236" y="213" font-size="7.66" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">no net movement</text><rect x="316" y="18" width="148" height="200" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="390.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Hypertonic</text><text x="390" y="39" font-size="7.42" text-anchor="middle" fill="#444" font-weight="normal" font-style="italic">(more concentrated outside)</text><path d="M374,70 C378,56 384,52 390,58 C396,50 404,56 406,68 C410,78 398,86 392,82 C386,90 376,84 374,70 Z" fill="#ffe3e0" stroke="#9b3b2a" stroke-width="1.8"/><circle cx="390" cy="70" r="4" fill="#d9ecff" stroke="#1f5fa8" stroke-width="1"/><text x="390" y="108" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">shrinks (crenation)</text><text x="336" y="50" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Animal</text><text x="336" y="130" font-size="7.89" text-anchor="start" fill="#444" font-weight="bold" font-style="normal">Plant</text><rect x="362" y="138" width="56" height="42" rx="5" fill="#fff" stroke="#2a7a3a" stroke-width="2.4"/><rect x="376" y="150" width="28" height="20" rx="6" fill="#c9efc9" stroke="#2a7a3a" stroke-width="1"/><text x="390" y="200" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="normal" font-style="normal">plasmolysed (wilts)</text><text x="390" y="213" font-size="7.66" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">water OUT</text></svg>