<svg viewBox="0 0 470 198" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Isolation leads to speciation</text><circle cx="48" cy="80" r="30" fill="#e8f3e0" stroke="#2a7a3a" stroke-width="1.6"/><text x="48" y="44" font-size="7.42" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">ONE POPULATION</text><text x="48" y="84" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">interbreed</text><circle cx="36" cy="68" r="3" fill="#e0a000" stroke="#a07000" stroke-width="0.5"/><circle cx="56" cy="66" r="3" fill="#e0a000" stroke="#a07000" stroke-width="0.5"/><circle cx="62" cy="86" r="3" fill="#e0a000" stroke="#a07000" stroke-width="0.5"/><circle cx="40" cy="94" r="3" fill="#e0a000" stroke="#a07000" stroke-width="0.5"/><circle cx="50" cy="78" r="3" fill="#e0a000" stroke="#a07000" stroke-width="0.5"/><line x1="80" y1="80" x2="112" y2="80" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="112" y="44" width="112" height="76" rx="3" fill="#fbfcfe" stroke="#999" stroke-width="1"/><rect x="160" y="44" width="16" height="76" rx="0" fill="#9fd0f0" stroke="#4a88c0" stroke-width="1"/><text x="168" y="38" font-size="7.42" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">BARRIER</text><circle cx="138" cy="84" r="18" fill="#fff1ee" stroke="#9b3b2a" stroke-width="1.4"/><circle cx="198" cy="84" r="18" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.4"/><text x="138" y="87" font-size="8.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">A</text><text x="198" y="87" font-size="8.0" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">B</text><line x1="226" y1="80" x2="252" y2="80" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="252" y="44" width="100" height="76" rx="3" fill="#fff8e8" stroke="#a05a00" stroke-width="1.2"/><text x="302" y="58" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">no gene flow:</text><text x="302" y="67" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">mutation, natural</text><text x="302" y="76" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">selection and drift</text><text x="302" y="85" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">change A and B</text><text x="302" y="94" font-size="7.66" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">differently</text><line x1="354" y1="80" x2="380" y2="80" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="44" width="84" height="76" rx="3" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.4"/><text x="422" y="62" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">NEW SPECIES</text><text x="422" y="72" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">A and B can no</text><text x="422" y="82" font-size="7.89" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">longer interbreed</text><rect x="6" y="132" width="110" height="44" rx="3" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="61" y="144" font-size="8.12" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Geographic</text><text x="61" y="155" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">river, mountain, island</text><text x="61" y="163" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">split by a storm</text><rect x="122" y="132" width="110" height="44" rx="3" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="177" y="144" font-size="8.12" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Ecological (habitat)</text><text x="177" y="155" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">same area, different</text><text x="177" y="163" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">habitats (trees vs</text><text x="177" y="171" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">grassland)</text><rect x="238" y="132" width="110" height="44" rx="3" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="293" y="144" font-size="8.12" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Temporal</text><text x="293" y="155" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">breed at different times</text><rect x="354" y="132" width="110" height="44" rx="3" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="409" y="144" font-size="8.12" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Behavioural</text><text x="409" y="155" font-size="6.96" text-anchor="middle" fill="#333" font-weight="normal" font-style="normal">different courtship calls</text><text x="235" y="190" font-size="7.66" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">P25 Q5c: lizards in one desert, different habitats = ecological;  island split by a storm = geographic</text></svg>