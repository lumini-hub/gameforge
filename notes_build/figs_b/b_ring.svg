<svg viewBox="0 0 470 224" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Ring (girdling) experiment</text><rect x="10" y="18" width="148" height="200" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="84.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Start</text><rect x="70" y="50" width="28" height="150" rx="0" fill="#c79a5a" stroke="#7a5a2a" stroke-width="1.4"/><rect x="76" y="50" width="16" height="150" rx="0" fill="#f2e6c8" stroke="#7a5a2a" stroke-width="0.8"/><rect x="70" y="120" width="28" height="24" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><rect x="76" y="120" width="16" height="24" rx="0" fill="#f2e6c8" stroke="#7a5a2a" stroke-width="0.8"/><text x="18" y="108" font-size="7.66" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">ring of bark</text><text x="18" y="116" font-size="7.66" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">removed</text><line x1="46" y1="118" x2="69" y2="130" stroke="#666" stroke-width="0.8"/><ellipse cx="62" cy="52" rx="18" ry="6" fill="#6fcf6f" stroke="#2a7a3a" stroke-width="1" transform="rotate(-25 62 52)"/><ellipse cx="106" cy="54" rx="18" ry="6" fill="#6fcf6f" stroke="#2a7a3a" stroke-width="1" transform="rotate(25 106 54)"/><rect x="165" y="18" width="148" height="200" rx="3" fill="#fbfcfe" stroke="#b9c7d8" stroke-width="1"/><text x="239.0" y="29" font-size="8.4" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">After a few months</text><rect x="225" y="50" width="28" height="150" rx="0" fill="#c79a5a" stroke="#7a5a2a" stroke-width="1.4"/