<svg viewBox="0 0 470 180" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Genetic engineering: making disease-resistant, high-yield cattle</text><rect x="4" y="28" width="86" height="82" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="47.0" y="42" font-size="8.12" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">1</text><text x="47.0" y="51" font-size="8.12" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">Find the gene</text><text x="47.0" y="70" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">disease-resistance gene</text><text x="47.0" y="78" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">in the local breed</text><line x1="91" y1="70" x2="97" y2="70" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="98" y="28" width="86" height="82" rx="5" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.6"/><text x="141.0" y="42" font-size="8.12" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">2</text><text x="141.0" y="51" font-size="8.12" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">Cut it out</text><text x="141.0" y="70" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">restriction enzyme</text><text x="141.0" y="78" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">(molecular scissors)</text><line x1="185" y1="70" x2="191" y2="70" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="192" y="28" width="86" height="82" rx="5" fill="#fff4e0" stroke="#a05a00" stroke-width="1.6"/><text x="235.0" y="42" font-size="8.12" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">3</text><text x="235.0" y="51" font-size="8.12" text-anchor="middle" fill="#a05a00" font-weight="bold" font-style="normal">Insert in vector</text><text x="235.0" y="70" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">gene joined into a</text><text x="235.0" y="78" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">plasmid (recombinant DNA)</text><line x1="279" y1="70" x2="285" y2="70" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="286" y="28" width="86" height="82" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="329.0" y="42" font-size="8.12" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">4</text><text x="329.0" y="51" font-size="8.12" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">Transfer</text><text x="329.0" y="70" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">vector carries gene</text><text x="329.0" y="78" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">into high-yield hybrid cell</text><line x1="373" y1="70" x2="379" y2="70" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="380" y="28" width="86" height="82" rx="5" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.6"/><text x="423.0" y="42" font-size="8.12" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">5</text><text x="423.0" y="51" font-size="8.12" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">Grow</text><text x="423.0" y="70" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">embryo → GM cattle:</text><text x="423.0" y="78" font-size="6.96" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">high yield + resistant</text><line x1="20" y1="130.0" x2="20" y2="130.0" stroke="#aaa" stroke-width="1"/><circle cx="20" cy="130.0" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="20" cy="130.0" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="28" y1="136.26661527701987" x2="28" y2="123.73338472298013" stroke="#aaa" stroke-width="1"/><circle cx="28" cy="136.26661527701987" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="28" cy="123.73338472298013" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="36" y1="137.79078104702558" x2="36" y2="122.20921895297444" stroke="#aaa" stroke-width="1"/><circle cx="36" cy="137.79078104702558" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="36" cy="122.20921895297444" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="44" y1="133.41903904187063" x2="44" y2="126.58096095812937" stroke="#aaa" stroke-width="1"/><circle cx="44" cy="133.41903904187063" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="44" cy="126.58096095812937" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="52" y1="126.45983645364117" x2="52" y2="133.54016354635883" stroke="#aaa" stroke-width="1"/><circle cx="52" cy="126.45983645364117" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="52" cy="133.54016354635883" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="60" y1="122.17975905867922" x2="60" y2="137.82024094132078" stroke="#aaa" stroke-width="1"/><circle cx="60" cy="122.17975905867922" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="60" cy="137.82024094132078" r="1.8" fill="#d33" stroke="#d33" stroke-width="0"/><line x1="68" y1="123.8178840995521" x2="68" y2="136.1821159004479" stroke="#aaa" stroke-width="1"/><circle cx="68" cy="123.8178840995521" r="1.8" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="0"/><circle cx="68" cy="136.182115