<svg viewBox="0 0 470 208" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">Reflex arc: pulling the hand from a hot stove</text><rect x="4.0" y="40" width="66" height="74" rx="5" fill="#ffe8e8" stroke="#b3211b" stroke-width="1.6"/><text x="37.0" y="62" font-size="8.58" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">STIMULUS</text><text x="37.0" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">hot stove</text><line x1="71.0" y1="77" x2="80.4" y2="77" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="81.4" y="40" width="66" height="74" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="114.4" y="62" font-size="8.58" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">RECEPTOR</text><text x="114.4" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">pain / heat</text><text x="114.4" y="98.5" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">receptor in skin</text><line x1="148.4" y1="77" x2="157.8" y2="77" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="158.8" y="40" width="66" height="74" rx="5" fill="#eaf3ff" stroke="#1f5fa8" stroke-width="1.6"/><text x="191.8" y="55" font-size="8.58" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">SENSORY</text><text x="191.8" y="64" font-size="8.58" text-anchor="middle" fill="#1f5fa8" font-weight="bold" font-style="normal">NEURON</text><text x="191.8" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">carries signal</text><text x="191.8" y="98.5" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">to spinal cord</text><line x1="225.8" y1="77" x2="235.20000000000002" y2="77" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="236.20000000000002" y="40" width="66" height="74" rx="5" fill="#f3eaff" stroke="#7a3b9b" stroke-width="1.6"/><text x="269.20000000000005" y="55" font-size="8.58" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">INTER-</text><text x="269.20000000000005" y="64" font-size="8.58" text-anchor="middle" fill="#7a3b9b" font-weight="bold" font-style="normal">NEURON</text><text x="269.20000000000005" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">(relay neuron) in</text><text x="269.20000000000005" y="98.5" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">spinal cord</text><line x1="303.20000000000005" y1="77" x2="312.6" y2="77" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="313.6" y="40" width="66" height="74" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="346.6" y="55" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">MOTOR</text><text x="346.6" y="64" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">NEURON</text><text x="346.6" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">carries signal</text><text x="346.6" y="98.5" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">to muscle</text><line x1="380.6" y1="77" x2="390.0" y2="77" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><rect x="391.0" y="40" width="66" height="74" rx="5" fill="#eaf6ec" stroke="#2a7a3a" stroke-width="1.6"/><text x="424.0" y="62" font-size="8.58" text-anchor="middle" fill="#2a7a3a" font-weight="bold" font-style="normal">EFFECTOR</text><text x="424.0" y="90.0" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">arm muscle</text><text x="424.0" y="98.5" font-size="7.19" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">contracts</text><text x="462" y="134" font-size="8.2" text-anchor="end" fill="#2a7a3a" font-weight="bold" font-style="normal">RESPONSE: the hand is pulled away</text><rect x="184" y="150" width="170" height="34" rx="4" fill="#fffbe9" stroke="#b3a000" stroke-width="1.2"/><text x="269" y="163" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">BRAIN is told afterwards (dotted line):</text><text x="269" y="172" font-size="7.19" text-anchor="middle" fill="#444" font-weight="normal" font-style="normal">you feel the pain → the reflex itself is faster, brain not in the first pathway</text><line x1="269" y1="150" x2="269" y2="116" stroke="#b3a000" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#a)"/><text x="235" y="200" font-size="7.89" text-anchor="middle" fill="#b3211b" font-weight="bold" font-style="normal">Receptor → sensory neuron → interneuron → motor neuron → effector  (P25 Q1a(xxi): option C)</text></svg>