<svg viewBox="0 0 470 290" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><text x="235" y="12" font-size="9.5" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">The nephron (draw and label)</text><circle cx="104" cy="66" r="25" fill="#fff6e6" stroke="#8a5a1a" stroke-width="2"/><path d="M96,56 C104,48 116,54 110,62 C104,70 96,64 104,58 C112,70 100,78 94,70 C90,64 96,58 96,56 Z" fill="#ff9a8a" stroke="#b3211b" stroke-width="1.2"/><path d="M40,50 L88,60" fill="none" stroke="#d9544a" stroke-width="5"/><path d="M40,82 L88,74" fill="none" stroke="#7a9ad9" stroke-width="4"/><text x="30" y="48" font-size="7.19" text-anchor="end" fill="#b3211b" font-weight="normal" font-style="normal">afferent</text><text x="30" y="56" font-size="7.19" text-anchor="end" fill="#b3211b" font-weight="normal" font-style="normal">arteriole</text><text x="30" y="90" font-size="7.19" text-anchor="end" fill="#4a6ac0" font-weight="normal" font-style="normal">efferent</text><text x="30" y="98" font-size="7.19" text-anchor="end" fill="#4a6ac0" font-weight="normal" font-style="normal">arteriole</text><path d="M104,91 C92,98 118,100 104,108 C92,114 118,118 104,126 L104,132" fill="none" stroke="#c28a2a" stroke-width="5"/><path d="M104,132 L104,246 C104,262 140,262 140,246 L140,150" fill="none" stroke="#c28a2a" stroke-width="5"/><path d="M140,150 C150,140 150,160 160,150 C172,140 172,160 182,150 L214,150" fill="none" stroke="#c28a2a" stroke-width="5"/><path d="M214,150 L214,60 L250,60 L250,100 L250,258" fill="none" stroke="#c28a2a" stroke-width="5"/><path d="M104,132 L104,246" fill="none" stroke="#e6c07a" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="120" y1="34.9" x2="110" y2="52" stroke="#666" stroke-width="0.8"/><text x="122" y="38" font-size="8.35" text-anchor="start" fill="#b3211b" font-weight="bold" font-style="normal">glomerulus</text><line x1="174" y1="92.8" x2="126" y2="66" stroke="#666" stroke-width="0.8"/><text x="176" y="96" font-size="8.58" text-anchor="start" fill="#8a5a1a" font-weight="bold" font-style="normal">Bowman’s capsule</text><line x1="54" y1="108.8" x2="95" y2="108" stroke="#666" stroke-width="0.8"/><text x="52" y="112" font-size="8.58" text-anchor="end" fill="#111" font-weight="bold" font-style="normal">PCT</text><line x1="88" y1="186.9" x2="104" y2="190" stroke="#666" stroke-width="0.8"/><text x="86" y="190" font-size="8.35" text-anchor="end" fill="#111" font-weight="normal" font-style="normal">descending limb</text><line x1="158" y1="204.9" x2="140" y2="208" stroke="#666" stroke-width="0.8"/><text x="160" y="208" font-size="8.35" text-anchor="start" fill="#111" font-weight="normal" font-style="normal">ascending limb</text><line x1="130" y1="268.4" x2="122" y2="262" stroke="#666" stroke-width="0.8"/><text x="130" y="276" font-size="8.82" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">Loop of Henle</text><line x1="160" y1="140" x2="160" y2="148" stroke="#666" stroke-width="0.8"/><text x="160" y="138" font-size="8.58" text-anchor="middle" fill="#111" font-weight="bold" font-style="normal">DCT</text><line x1="260" y1="96.8" x2="252" y2="100" stroke="#666" stroke-width="0.8"/><text x="262" y="100" font-size="8.58" text-anchor="start" fill="#111" font-weight="bold" font-style="normal">Collecting duct</text><line x1="250" y1="232" x2="250" y2="270" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="258" y="266" font-size="7.89" text-anchor="start" fill="#333" font-weight="normal" font-style="normal">urine to ureter</text><rect x="298" y="150" width="168" height="100" rx="4" fill="#f4f8fd" stroke="#9db7d4" stroke-width="1"/><text x="382" y="178" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Glomerulus + capsule: filtration</text><text x="382" y="189" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">PCT: glucose, amino acids, Na⁺,</text><text x="382" y="200" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">most water reabsorbed</text><text x="382" y="211" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">Loop of Henle: salt gradient;</text><text x="382" y="222" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">water leaves descending limb</text><text x="382" y="233" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">DCT: Na⁺ (aldosterone), water (ADH);</text><text x="382" y="244" font-size="7.42" text-anchor="middle" fill="#111" font-weight="normal" font-style="normal">urea, K⁺ secreted</text><text x="382" y="164" font-size="8.58" text-anchor="middle" fill="#0e3a66" font-weight="bold" font-style="normal">What each part does</text></svg>